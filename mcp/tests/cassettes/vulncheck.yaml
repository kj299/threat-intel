        "_timestamp": "2026-09-04T19:36:49.118123904Z"}, {"vendorProject": "Alinto
        SOGo", "product": "SOGo", "shortDescription": "A cross-site scripting (XSS)
        vulnerability exists in Alinto SOGo, version  5.12.7. A maliciously crafted
        ICS calendar invitation files allows arbitrary JavaScript execution within
        the authenticated SOGo webmail session. The issue occurs because SVG content
        embedded in the description field of an ICS file, with an onrepeat event handler,
        is insufficiently sanitized before being rendered in the webmail interface.
