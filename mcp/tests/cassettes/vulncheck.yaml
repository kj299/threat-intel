        "_timestamp": "2026-09-04T01:06:51.700590398Z"}, {"vendorProject": "Melograno",
        "product": "Booking for Appointments and Events Calendar \u2013 Amelia", "shortDescription":
        "The Booking for Appointments and Events Calendar \u2013 Amelia (Premium)
        plugin for WordPress is vulnerable to Privilege Escalation in versions 8.0
        - 9.6.2. This is due to insufficient validation of the attacker-controlled
        ''type'' parameter in the customer update endpoint, which allows customers
        to set their role to ''manager'' and trigger creation of a WordPress user
        with the wpamelia-manager role when the ''externalId'' parameter is set to
        0. This makes it possible for unauthenticated attackers to escalate their
        privileges to administrator by first elevating to the manager role, then creating
        a provider entity linked to an administrator user ID and overwriting that
        administrator''s password.", "vulnerabilityName": "  Improper Privilege Management",
        "required_action": "Apply remediations or mitigations per vendor instructions
        or discontinue use of the product if remediation or mitigations are unavailable.",
        "knownRansomwareCampaignUse": "Unknown", "cve": ["CVE-2026-9055"], "cwes":
        [], "vulncheck_xdb": [], "vulncheck_reported_exploitation": [{"url": "https://patchstack.com/database/wordpress/plugin/ameliabooking/vulnerability/wordpress-booking-for-appointments-and-events-calendar-amelia-premium-plugin-8-0-9-6-2-unauthenticated-privilege-escalation-to-administrator-via-externalid-vulnerability",
        "date_added": "2026-09-01T00:00:00Z"}], "reported_exploited_by_vulncheck_canaries":
