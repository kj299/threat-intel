        malicious calendar invite is viewed.  Successful exploitation may allow mailbox
        access, email and contact theft, session hijacking, and other actions allowed
        by an authenticated user.", "vulnerabilityName": "  Improper Neutralization
        of Input During Web Page Generation (''Cross-site Scripting'')", "required_action":
