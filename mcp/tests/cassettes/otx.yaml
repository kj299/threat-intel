        Snapshot: Djinn Stealer","description":"Djinn Stealer is a cross-platform
        information stealer delivered as a second-stage payload by the TaskWeaver
        Node.js loader. It employs a rules-based collection engine to harvest credentials
        and configuration data from cloud platforms, source control systems, package
        registries, infrastructure tooling, AI development assistants, browsers, SSH,
        and cryptocurrency wallets. The stolen data is archived, encrypted, and exfiltrated
        to attacker-controlled infrastructure. This threat has been observed following
        exploitation of the SimpleHelp vulnerability CVE-2026-48558. The stealer executes
        within a Node.js runtime context and communicates with command-and-control
        servers using encrypted channels for data exfiltration.","author_name":"AlienVault","modified":"2026-10-10T12:00:26.481000","created":"2026-09-10T12:49:58.502000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4408892702,"indicator":"CVE-2026-48558","type":"CVE","created":"2026-09-10T12:49:59","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4439589929,"indicator":"f4a72600a3735c2a4d843875ea61bbb6f935a1af51a81f2fbc992ce11ba94afc","type":"FileHash-SHA256","created":"2026-09-10T12:49:59","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["djinn
