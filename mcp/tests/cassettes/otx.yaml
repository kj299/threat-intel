  response:
    body:
      string: '{"results":[{"id":"6aa4432cfc2e960cdf6ac1e0","name":"Malicious Twitch
        Browser Extension Exposes 30,000 Users'' OAuth Tokens to Russian Bot Service","description":"A
        malicious browser extension called ''Twitch Enhanced Viewer | JeetBot'' distributed
        on Chrome Web Store and Firefox Add-ons captures and forwards users'' live
        Twitch OAuth session tokens to Russian-controlled proxy servers. The extension,
        with approximately 30,000 Chrome users and 552 Firefox users, markets itself
        as a quality-of-life tool for blocking ads and unlocking streams. While delivering
        these features, it secretly extracts users'' account-scoped OAuth tokens and
        forwards them as query parameters to operator-controlled infrastructure. Current
        versions append tokens inline during video playlist redirects, while earlier
        builds explicitly POSTed tokens to dedicated collection endpoints. The operator
        is identified as a commercial Russian bot service called JeetBot, with infrastructure
        hosted across German and cloud providers.","author_name":"AlienVault","modified":"2026-10-11T18:01:32.075000","created":"2026-09-11T18:06:36.780000","revision":2,"tlp":"white","public":1,"adversary":"JeetBot","indicators":[{"id":4494268540,"indicator":"141c35607dc0e8e400deb380126b3052bd0495b4d37c8dd979c6aa0204b142fc","type":"FileHash-SHA256","created":"2026-09-11T18:06:37","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494268541,"indicator":"e17e1e671b597da19b89c5b2d0fa821e90e627860e756ae4947ed27c035330a8","type":"FileHash-SHA256","created":"2026-09-11T18:06:37","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494268544,"indicator":"http:\/\/api.jeetbot.cc\/api\/v2\/public\/extension_helper\/","type":"URL","created":"2026-09-11T18:06:37","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494268545,"indicator":"http:\/\/enhanced.jeetbot.cc\/set-token","type":"URL","created":"2026-09-11T18:06:37","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494268546,"indicator":"http:\/\/ext-styles.jeetbot.cc\/api\/v1\/forced-proxy","type":"URL","created":"2026-09-11T18:06:37","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494268547,"indicator":"http:\/\/ext-styles.jeetbot.cc\/api\/v1\/proxies","type":"URL","created":"2026-09-11T18:06:37","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494268548,"indicator":"http:\/\/proxy.thebeholder.deno.net\/set-token","type":"URL","created":"2026-09-11T18:06:37","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494268549,"indicator":"http:\/\/thebeholder-proxy.deno.dev\/set-token","type":"URL","created":"2026-09-11T18:06:37","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494268550,"ind