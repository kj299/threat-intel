        token theft","browser extension","proxy infrastructure","twitch"],"targeted_countries":[],"malware_families":[],"attack_ids":["T1557","T1056.001","T1213.002","T1539","T1176","T1219","T1185","T1555.003","T1090.002","T1552.001","T1573.002","T1567.002","T1071.001"],"references":["https:\/\/socket.dev\/blog\/malicious-twitch-browser-extension"],"industries":[],"extract_source":[],"more_indicators":false},{"id":"6aa4409a4290cc035d81500c","name":"KATARU:
        IoT Malware Adopts Public LPE Exploits","description":"KATARU is an IoT malware
        variant discovered in August 2026 through Telnet credential brute-forcing
        against a honeypot from Vietnam. While maintaining traditional Mirai-style
        botnet capabilities, it distinguishes itself through an extensive feature
        set including multiple Linux local privilege escalation exploits, comprehensive
        persistence mechanisms across Linux and embedded platforms, encrypted C2 communications
        using X25519 and ChaCha20-Poly1305, anti-analysis techniques, and decoy traffic
        generation. Implementation artifacts strongly suggest AI-assisted development,
        evidenced by architecture-mismatched x86 shellcode in ARM binaries, RFC test
        vectors as configuration values, and untested cross-platform persistence logic.
        The malware attempts various privilege escalation paths through system misconfigurations
        and public exploits, establishes persistence across numerous startup mechanisms,
        and supports multiple DDoS attack vectors alongside SSH brute-forcing capabilities.","author_name":"AlienVault","modified":"2026-10-11T17:02:40.356000","created":"2026-09-11T17:55:38.561000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4325948939,"indicator":"CVE-2026-31431","type":"CVE","created":"2026-09-11T17:55:39","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4348933677,"indicator":"CVE-2026-43284","type":"CVE","created":"2026-09-11T17:55:39","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4373886755,"indicator":"CVE-2026-46300","type":"CVE","created":"2026-09-11T17:55:39","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4477283334,"indicator":"9d7cd4948a1fcbaeadc425752fce9a933bd6fc41eeede030dffd7b99b3bc51d5","type":"FileHash-SHA256","created":"2026-09-11T17:55:39","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494252171,"indicator":"cc76bc218627279ecb4d0ce74ad2651e9db9e3e843e35d6569576e056e3a9218","type":"FileHash-SHA256","created":"2026-09-11T17:55:39","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494252172,"indicator":"13382c16e2401b07451577b46e634b8031ec254d98b876e59692b5fa22abc1d4","type":"FileHash-SHA256","created":"2026-09-11T17:55:39","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494252173,"indicator":"6fbae3505ae0d638b820165c572d548ce92dda71e82dc47e8efe13f30617f35f","type":"FileHash-SHA256","created":"2026-09-11T17:55:39","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494252174,"indicator":"9d87e6615c810907443ebd5e915f3b35099c3b5c6b6c684637138a7f8ec9cebc","type":"FileHash-SHA256","created":"2026-09-11T17:55:39","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":44