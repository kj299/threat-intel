        Turns Vulnerable Edge Devices Into Attacker Infrastructure","description":"An
        evolving Linux malware campaign deploys ClingSTUN, a back-connect proxy backdoor
        exploiting known vulnerabilities in Internet-facing IoT and network devices.
        The malware establishes persistent access and converts compromised systems
        into remotely controlled proxy nodes. Supporting multiple Linux architectures,
        ClingSTUN combines boot persistence, process termination, watchdog manipulation,
        process concealment, remote command execution, and self-propagation. It abuses
        legitimate public STUN infrastructure for NAT traversal. The campaign has
        expanded the number of vulnerabilities and device vendors it targets over
        time, affecting products from D-Link, EnGenius, Realtek, TP-Link, AVTECH,
        Ivanti, Tenda, Lantronix, and others, highlighting the continued risk posed
        by unpatched, unsupported, and unnecessarily exposed Internet-facing devices.","author_name":"AlienVault","modified":"2026-10-14T13:43:18.958000","created":"2026-10-14T12:44:18.127000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":2199241492,"indicator":"CVE-2017-7921","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":2873968331,"indicator":"CVE-2021-21974","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":2959959659,"indicator":"CVE-2021-3493","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3355305903,"indicator":"CVE-2022-21894","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3363701643,"indicator":"CVE-2021-4034","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3463951560,"indicator":"CVE-2022-30190","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3465935303,"indicator":"CVE-2022-26134","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3599407767,"indicator":"CVE-2022-31199","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3635958549,"indicator":"CVE-2022-47986","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3638449296,"indicator":"CVE-2021-33044","type":"CVE","created":"2026-10-14T12:44:18","content":"","title":"","description":"","expiration":null,