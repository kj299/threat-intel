        Under Attack: In-the-Wild Exploitation of CVE-2026-42016, CVE-2026-42018 &
        CVE-2026-82329","description":"Active exploitation of three critical vulnerabilities
        in JFrog Artifactory has been identified, with attackers chaining CVE-2026-42016,
        CVE-2026-42018, and CVE-2026-82329 to bypass authentication and gain administrative
        control. CVE-2026-42018 exposes internal anonymous-user tokens, CVE-2026-42016
        enables privilege escalation through insufficient token validation, and CVE-2026-82329
        allows unauthenticated access to administrative privileges. Post-exploitation
        activities include creating persistent administrator accounts, deploying malicious
        Groovy plugins for code execution, and installing Rust-based backdoors. Exploitation
        was observed between August 15 and September 8, 2026, affecting multiple organizations.
        Data indicates 67-69% of organizations running Artifactory had vulnerable
        instances at initial publication, with slow patching velocity for lower-severity
        CVEs despite active exploitation across environments.","author_name":"AlienVault","modified":"2026-10-11T07:08:57.961000","created":"2026-09-11T07:05:53.978000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4489188554,"indicator":"CVE-2026-82329","type":"CVE","created":"2026-09-11T07:05:54","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494109382,"indicator":"CVE-2026-42016","type":"CVE","created":"2026-09-11T07:05:54","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494109383,"indicator":"CVE-2026-42018","type":"CVE","created":"2026-09-11T07:05:54","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494109384,"indicator":"ac6c52632fcf8b072be3b1c5bc076fdd","type":"FileHash-MD5","created":"2026-09-11T07:05:54","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494109385,"indicator":"513a907b69edffc3cb77a494da395178d21ef9bd","type":"FileHash-SHA1","created":"2026-09-11T07:05:54","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494109386,"indicator":"6639abda5778b31cc049e4af0a71da04750fafda97d44eec3dd202d32e3e2496","type":"FileHash-SHA256","created":"2026-09-11T07:05:54","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494109394,"indicator":"http:\/\/log.gitclone.org:45678\/smtp","type":"URL","created":"2026-09-11T07:05:54","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4494109395,"indicator":"log.gitclone.org","type":"hostname","created":"2026-09-11T07:05:54","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["privilege
