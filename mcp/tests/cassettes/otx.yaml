        From Fake Updates to Patched Banking Apps","description":"A new Android banking
        remote access trojan named Hirudo has been identified, combining credential
        theft with live remote control. It is delivered through shopping and entertainment
        apps that act as droppers, installing the trojan as a separate package behind
        fake update prompts. The malware replaces legitimate banking applications
        with patched versions that disable security checks from within the app itself.
        Eight Indonesian banking apps covering seven banks have been targeted with
        purpose-built replacements embedding a hooking engine. The campaign uses real
        advertising infrastructure including Amazon CloudFront for distribution, with
        targeting extending beyond Indonesia to China, India, Mexico, Morocco, Thailand,
        and Malaysia. Backend data from August 2026 revealed thousands of stolen credentials
        and device records.","author_name":"AlienVault","modified":"2026-10-15T10:01:06.298000","created":"2026-10-14T13:35:47.216000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4527203187,"indicator":"3ccd2c02cf0661613816ca30032b4cdd","type":"FileHash-MD5","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527203188,"indicator":"3b14859a3a1219515f89ff453c7031f3dc8a95d7","type":"FileHash-SHA1","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527203189,"indicator":"0097a0406be20544e98e981075427f40789db40fe4a53b1b4523383a945328b7","type":"FileHash-SHA256","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527203190,"indicator":"2e45277acfde3fb704179476b08f428f66a03670bbdbf2e8ec79c0b0333c009b","type":"FileHash-SHA256","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527203191,"indicator":"425cd7072b5e9386ac94e97fe272980b6ef36240df6b5d77b371ab7378004c83","type":"FileHash-SHA256","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527203192,"indicator":"b2270c29b3d0a49a716730d6ef108cffec0b1a4b159dd02e93333fb85e492b99","type":"FileHash-SHA256","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527203193,"indicator":"d51f2bd7ffb49c224d8eaec2c8ca1c8ab9fce2fd5fdceea01eb54296c2f47b4d","type":"FileHash-SHA256","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527203194,"indicator":"f796eb9ecf516e4f1fafcf89200d9f7d8ddd234f705e63f1bc8fc3ef583f0248","type":"FileHash-SHA256","created":"2026-10-14T13:35:48","content":"","title":"","descript