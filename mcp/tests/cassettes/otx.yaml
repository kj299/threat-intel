        Q3 Linux SSH Server Targeted Malware Statistics Report","description":"During
        Q3 2026, honeypot monitoring revealed attacks targeting poorly managed Linux
        SSH servers through brute force and dictionary attacks. Primary malware families
        included ShellBot (also known as PerlBot), a Perl-based DDoS bot with C&C
        infrastructure at specific IPs, and Fisieredoor, a backdoor capable of executing
        commands and deploying SSH dictionary attack tools. Attackers downloaded malware
        using wget or curl, then installed user-mode rootkits, XHide process masking
        tools, and XMRig cryptocurrency miners. The launcher malware utilized ld.so.preload
        to inject rootkits and disguised mining processes as legitimate bash sessions.
        Fisieredoor deployed additional tools including goauto and tsm for credential
