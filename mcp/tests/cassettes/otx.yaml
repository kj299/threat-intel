        A Banking Trojan with Distributed Data-Receiving Servers","description":"In
        August 2026, a Casbaneiro campaign targeted Latin American users through phishing
        emails and PDFs themed as fake invoices and legal notices. The multi-stage
        infection chain includes HTA downloaders and AutoIt loaders, employing geofencing
        to filter victims by IP address location. The malware exhibits sophisticated
        evasion techniques, including distributed data-receiving servers, deliberate
        HTTP 403 responses, and activation only when victims access targeted banking
        websites. Casbaneiro steals email data, performs clipboard injection, and
        creates fake windows for fraudulent activities. The campaign specifically
        targets Argentina, Peru, Colombia, and Mexico while avoiding German, French,
        and English language systems. The malware splits stolen data across multiple
        servers and uses malformed HTTP packets to complicate detection and analysis
        efforts.","author_name":"AlienVault","modified":"2026-10-10T17:04:01.278000","created":"2026-09-10T17:27:46.862000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4493744802,"indicator":"4302586202234cdf1ca058fd3c62be0050c8155ed113f3f62337d756e6915044","type":"FileHash-SHA256","created":"2026-09-10T17:27:47","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4493744803,"indicator":"47d321c1a232e5cdd1e39a06dadbd79114dc1a2f0f8eac289e6b653a5d126f95","type":"FileHash-SHA256","created":"2026-09-10T17:27:47","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4493744804,"indicator":"51503ce1373c7fa72a1da5c5c4b30f88c8224686669ba4b64196591414fdc64c","type":"FileHash-SHA256","created":"2026-09-10T17:27:47","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4493744805,"indicator":"5a76669ec410d0b3e21112a4a6fd3207976b299ee27c5fc3d42f2673170ab95e","type":"FileHash-SHA256","created":"2026-09-10T17:27:47","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4493744806,"indicator":"62ef39ec29966d71c8254f68bd5e320cf24a042d76c12dbafdcc0766861827c5","type":"FileHash-SHA256","created":"2026-09-10T17:27:47","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4493744807,"indicator":"6bb4372d0d02ec87b76409f69d445a93910964f8db457bafafb97a011da59e73","type":"FileHash-SHA256","created":"2026-09-10T17:27:47","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4493744808,"indicator":"6e6bd2f7566ffa52d52fa9d5f048bbb9246d3d50110c6b0c248919ad796c6fd4","type":"FileHash-SHA256","created":"2026-09-10T17:27:47","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4493744809,"indicator":"711c0aa8cde078aa349fb329e3e44e4272ea66a5e651ad8a64893c76a725c859","type":"FileHash-SHA256","created":"2026