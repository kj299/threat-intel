        AI Agents Turned One Exposed Endpoint into a Server Takeover","description":"An
        investigation revealed the first confirmed incident where large language model-driven
        AI agents executed substantial portions of an attack. Within 24 hours, attackers
        exploited an exposed job-submission feature on an Apache Tomcat server running
        Spring Batch, requiring no authentication, zero-days, or new malware. The
        attacker used Cairn, an open-source AI agent orchestration platform, identified
        on the attacking infrastructure. Commands were executed through JavaScript
        via Nashorn engine, with results extracted through error messages in 1,800-byte
        chunks across hundreds of sequential requests. The attacker recovered plaintext
        database credentials from configuration files, enabled xp_cmdshell, and escalated
        privileges using PrintSpoofer and GodPotato tools to achieve SYSTEM access.
        Registry hives were extracted, administrator accounts created, and artifacts
        deleted. Machine-driven execution was evidenced by rapid command timing, programmatic
        job naming, structured output formatting, and automated error ...","author_name":"AlienVault","modified":"2026-10-15T09:52:26.921000","created":"2026-10-15T07:06:58.694000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4389746454,"indicator":"204.194.54.240","type":"IPv4","created":"2026-10-15T07:06:59","content":"","title":"","description":"","expiration":"2026-11-14T07:00:00","is_active":1,"role":null},{"id":4503151503,"indicator":"204.194.55.189","type":"IPv4","created":"2026-10-15T07:06:59","content":"","title":"","description":"","expiration":"2026-11-14T07:00:00","is_active":1,"role":null},{"id":4519885512,"indicator":"94.177.131.113","type":"IPv4","created":"2026-10-15T07:06:59","content":"","title":"","description":"","expiration":"2026-11-14T07:00:00","is_active":1,"role":null}],"tags":["privilege
