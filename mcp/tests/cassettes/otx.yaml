        to Disaster: How One Click Installs a RAT","description":"Cybercriminals are
        exploiting digital event invitations to distribute remote access trojans.
        Victims receive legitimate-looking emails with generic subject lines about
        special gatherings and celebrations. The messages contain download buttons
        that redirect users through fake CAPTCHA verification pages hosted on recently
        created domains. After verification, users encounter another generic invitation
        page prompting them to download an eInvite file. This delivers a zipped folder
        containing ScreenConnect.exe, a legitimate ConnectWise Screen Connect installer
        weaponized as a RAT. Once executed, attackers gain full remote access to compromised
        devices through an unassuming taskbar icon that reveals an active connection.
        The campaign leverages user curiosity rather than sophisticated techniques,
        making it particularly effective during holiday seasons when event invitations
        are common.","author_name":"AlienVault","modified":"2026-10-14T06:52:21.077000","created":"2026-10-13T18:51:43.410000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4525429567,"indicator":"739a54032b89432bb4c9c33969f6b383","type":"FileHash-MD5","created":"2026-10-13T18:51:44","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4525429568,"indicator":"f3aab811ae8163e09db40db201facc7e189d1a1b161be265202ca54b39b5e6cc","type":"FileHash-SHA256","created":"2026-10-13T18:51:44","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4525429569,"indicator":"https:\/\/theinvitationestateco.vu\/EdesktopInvite\/RsvpNow\/invitedetails.php","type":"URL","created":"2026-10-14T06:52:00","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4526621771,"indicator":"theinvitationestateco.vu","type":"domain","created":"2026-10-13T18:51:44","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["captcha
