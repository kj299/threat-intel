        Broadband Provider Targeted via FortiGate SSL-VPN and MeshCentral Persistence","description":"An
        exposed directory on a Thai server revealed an active intrusion campaign targeting
        3BB (Triple T Broadband), one of Thailand''s largest broadband providers.
        The attacker exploited CVE-2024-21762 in a FortiGate 60F SSL-VPN appliance
        to gain initial access, then deployed MeshCentral remote management software
        for persistent command-and-control. The operation involved extensive reconnaissance,
        credential harvesting targeting RADIUS authentication databases, privilege
        escalation using PwnKit and Dirty COW exploits, lateral movement via SSH brute-forcing
        across 55+ internal hosts, and anti-forensic cleanup procedures. Multiple
        devices were already enrolled under attacker control at discovery, with additional
        targeting of Jasmine International infrastructure. The attacker''s toolkit
        included web application exploitation scripts, database credential extraction
        tools, and persistence mechanisms designed to maintain long-term access to
        subscriber authentication systems.","author_name":"AlienVault","modified":"2026-10-14T19:03:15.988000","created":"2026-09-14T19:47:14.699000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":3840896519,"indicator":"CVE-2024-21762","type":"CVE","created":"2026-09-14T19:47:15","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4495918656,"indicator":"mail.3bb.co.th","type":"hostname","created":"2026-09-14T19:47:15","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4495918657,"indicator":"www.ayuthayatech.com","type":"hostname","created":"2026-09-14T19:47:15","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4495918658,"indicator":"agent.3bb.co.th","type":"hostname","created":"2026-09-14T19:47:15","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4495929848,"indicator":"ccs.jasmine.com","type":"hostname","created":"2026-09-14T19:47:15","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4495929849,"indicator":"openvpn.jasmine.com","type":"hostname","created":"2026-09-14T19:47:15","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["meshcentral","cve-2024-21762","fortigate
        ssl-vpn","FortiGate"],"targeted_countries":["Thailand"],"malware_families":[],"attack_ids":["T1110.001","T1003","T1133","T1021.004","T1190","T1219","T1552","T1021.002","T1595.002","T1505.003","T1574.006","T1595","T1070","T1552.001","T1098","T1110","T1078","T1068","T1070.004","T1105","T1003.003"],"references":["https:\/\/hunt.io\/blog\/thai-broadband-fortigate-sslvpn-meshcentral-intrusion"],"industries":["Telecommunications"],"extract_source":[],"more_indicators":false},{"id":"6acf82f3a84bcf5248537bf9","name":"Case
        of AgentTesla Malware Distribution Disguised as a Business Proposal Email","description":"A
        phishing campaign has been observed distributing AgentTesla infostealer through
        emails masquerading as business proposal requests. Recipients are asked to
        review an attached product list, but the ZIP file contains an executable file
        instead of a document. The malicious EXE disguises itself as a caf\u00e9 management
        program using Chinese-language descriptions and UI elements. Through multiple
        stages of obfuscation, the malware extracts encrypted data from bitmap resources,
        performs XOR decryption, and loads successive .NET payloads into memory. The
        final payload is AgentTesla, which steals credentials, cookies, and contact
        information from browsers, email clients, FTP and VPN applications. Stolen
        data is exfiltrated via FTP to a compromised server. The attack demonstrates
        sophisticated multi-stage loading techniques and social engineering tactics
        targeting business users.","author_name":"AlienVault","modified":"2026-10-14T13:43:49.796000","created":"2026-10-14T13:26:11.771000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4527085602,"indicator":"anmarinee.it.com","type":"hostname","created":"2026-10-14T13:26:12","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527085603,"indicator":"8777a9b0533660fddc2a73b819638c18","type":"FileHash-MD5","created":"2026-10-14T13:26:12","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527085604,"indicator":"cbcc4ba1a1485cb01a4b65fc7915e629","type":"FileHash-MD5","created":"2026-10-14T13:26:12","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527202871,"indicator":"128e2c90b557f5d98181106829ef2c3c47367ef4","type":"FileHash-SHA1","created":"2026-10-14T13:26:12","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527202872,"indicator":"98c0879ad8c1d2c85e1d667e70e37810618c5c17","type":"FileHash-SHA1","created":"2026-10-14T13:26:12","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527202873,"indicator":"6e89b13fea49ba2b98eb22fe59e16904e3225304c0a56546bb0c08b6959a8790","type":"FileHash-SHA256","created":"2026-10-14T13:26:12","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527202874,"indicator":"9d5ca4e40dedfcdc58612e741433e571e82151ae9cade617250727b5ad3f7a49","type":"FileHash-SHA256","created":"2026-10-14T13:26:12","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["phishing
