        Infostealer Targets AI Coding Assistant Credentials","description":"The Aoki
        infostealer has evolved to target credentials from AI coding assistants including
        Claude, OpenAI''s Codex, Cursor, Codeium and Gemini. This capability represents
        a recent addition, as earlier versions did not target AI-related files. The
        malware steals API keys, tokens and session files that could enable attackers
        to conduct activities under legitimate user identities, access connected repositories,
        cloud services and CI\/CD pipelines. Beyond AI credentials, Aoki harvests
        data from dozens of browsers, cryptocurrency wallets, password managers, messaging
        applications, gaming platforms, VPN and FTP clients. The malware collects
