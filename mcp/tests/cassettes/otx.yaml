        Endpoint to Funhouse: Changes in Ransomware Families and Kimsuky-Related Distribution
        Cases","description":"A North Korean threat actor distributed Funhouse ransomware
        through malicious Korean-language documents disguised as resumes. Funhouse
        is a variant of the previously observed Endpoint ransomware. The attack chain
        involves multi-stage scripts including Batch, VBS, and PowerShell, leading
        to Quasar RAT installation before deploying the final ransomware payload.
        The campaign shares significant similarities with earlier Kimsuky Endpoint
        ransomware operations from early 2026, including identical mutex values, similar
        batch file structures, and comparable Quasar RAT configurations. The ransomware
        maintains key characteristics of the Endpoint family while updating encryption
        extensions, contact information, and C2 infrastructure. A notable shift involves
        using HWP documents instead of LNK files as initial infection vectors.","author_name":"AlienVault","modified":"2026-10-12T23:32:35.012000","created":"2026-10-12T13:15:52.686000","revision":2,"tlp":"white","public":1,"adversary":"Kimsuky","indicators":[{"id":4523495924,"indicator":"koocpt.site","type":"domain","created":"2026-10-12T13:15:53","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4523495936,"indicator":"70.36.97.236","type":"IPv4","created":"2026-10-12T13:15:53","content":"","title":"","description":"","expiration":"2026-11-11T13:00:00","is_active":1,"role":null},{"id":4523495937,"indicator":"17d97e3ee3185d82812a4014444c36f3","type":"FileHash-MD5","created":"2026-10-12T13:15:53","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4523495938,"indicator":"327617e977eefd15708568f43140e595","type":"FileHash-MD5","created":"2026-10-12T13:15:53","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4523495939,"indicator":"3d802ceaf891ea57ecd7d1d786d96a0d","type":"FileHash-MD5","created":"2026-10-12T13:15:53","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4523495940,"indicator":"5be7578bfe633fb268ad97a520abb4e1","type":"FileHash-MD5","created":"2026-10-12T13:15:53","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4523495941,"indicator":"78c219a6bec5fc30f43b62e4934646eb","type":"FileHash-MD5","created":"2026-10-12T13:15:53","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["funhouse
