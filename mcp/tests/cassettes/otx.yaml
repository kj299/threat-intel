        Otax: Indonesian Mobile Ransomware with Spyware Integration","description":"A
        sophisticated mobile threat linked to Indonesian actors combines ransomware
        and spyware capabilities in a single attack vector. The malware is distributed
        via third-party file-sharing platforms through social engineering, targeting
        Android devices. It requests extensive permissions including device administrator,
        SMS, contacts, and accessibility access. The threat encrypts files using AES
        on Android 9 and earlier, appending .enc extensions, while stealing sensitive
        data including screen recordings, browser history, PINs, contacts, call logs,
        SMS messages, WhatsApp and Telegram chats. It establishes C2 communication
        via HTTPS and WebSockets using dynamic domain resolution through GitHub. Version
        2 introduces UI hijacking, screen blocking, touch input interception, harassment
        features, and remote text-to-speech capabilities. The malware exfiltrates
        data through Firebase and Catbox services, enabling double-extortion through
        an interactive chat portal for ransom demands.","author_name":"AlienVault","modified":"2026-10-10T09:00:10.800000","created":"2026-09-09T20:59:12.183000","revision":3,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4375451137,"indicator":"c0118e8a7f9e93dcc1ee59ece90772ad","type":"FileHash-MD5","created":"2026-09-10T09:00:32","content":"","title":"ALF:AndroidOSSuspiciousPerms.A","description":"MD5
