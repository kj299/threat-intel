        Calendly \"Meta Careers\" pages steal Facebook and Google logins","description":"A
        wave of fraudulent websites mimicking Calendly booking pages for Meta job
        interviews has been identified, targeting job seekers to steal credentials.
        Victims select interview time slots, provide personal information, and complete
        fake CAPTCHA verifications before being prompted to log into Facebook and
        Google accounts. The sophisticated phishing kit captures login credentials
        and bypasses two-factor authentication by relaying authentication codes in
        real-time to attackers. The pages use convincing replicas of legitimate login
        screens with fake address bars displaying authentic URLs. Eleven domains following
        similar naming patterns have been identified, utilizing generic recruiting-related
        terms. The collection infrastructure operates through Amazon API Gateway in
        Singapore, with code comments in Vietnamese suggesting the operation''s possible
        origins.","author_name":"AlienVault","modified":"2026-10-15T09:59:20.180000","created":"2026-10-14T13:39:19.583000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4527142362,"indicator":"joinconnect.cfd","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142363,"indicator":"joinconnect.works","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142364,"indicator":"joinhire.cfd","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142365,"indicator":"joinhire.info","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142366,"indicator":"joinquest.cfd","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142367,"indicator":"joinquest.info","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142368,"indicator":"joinquest.works","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142369,"indicator":"jointhetalent.cfd","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142370,"indicator":"jointhetalent.info","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4527142371,"indicator":"jointhetalent.works","type":"domain","created":"2026-10-14T13:39:20","content":"","title":"","description":"","expiration":null,"is_active":1,"role":nu