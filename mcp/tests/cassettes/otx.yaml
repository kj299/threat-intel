        CVE-2026-104935: Zero-Day Chain Exploited in Operation Innovate","description":"Ivanti
        has released emergency security updates after attackers exploited a chain
        of three zero-day vulnerabilities in Connect Secure VPN appliances to gain
        root-level access without authentication. The attack began on October 3, targeting
        an appliance running version 22.8R2.4. Two vulnerabilities are tracked as
        CVE-2026-104935 with a CVSS score of 8.6, involving an authentication bypass
        and remote code execution through manipulated CGI requests and malicious file
        uploads. A third unpatched vulnerability allows privilege escalation to root
        by manipulating a privileged service through memory modification. While patches
        address the authentication bypass and RCE, the privilege escalation flaw remains
        unresolved. CISA added the vulnerability to its KEV catalog with an October
        16 remediation deadline for federal agencies.","author_name":"AlienVault","modified":"2026-10-15T09:59:53.703000","created":"2026-10-14T13:35:47.783000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4526679583,"indicator":"CVE-2026-104935","type":"CVE","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4526679586,"indicator":"108.165.147.64","type":"IPv4","created":"2026-10-14T13:35:48","content":"","title":"","description":"","expiration":"2026-11-13T13:00:00","is_active":1,"role":null}],"tags":["vpn
