        RAT: A Recipe for Cross Platform Espionage","description":"Noodle RAT, also
        known as ANGRYREBEL or Nood RAT, is a modular remote access trojan with dual
        versions for Windows and Linux, actively used by Chinese-speaking threat actors
        since at least mid-2016. Previously misclassified as variants of Gh0st RAT
        or Rekoobe, it is now recognized as a distinct backdoor family. The malware
        has been deployed in espionage and cybercrime campaigns targeting entities
        across the Asia-Pacific region, including Thailand, India, Japan, Malaysia,
        and Taiwan. Multiple threat groups including Iron Tiger, Calypso APT, Rocke,
        and Cloud Snooper have utilized this tool. Both variants feature shared command-and-control
        architecture, similar configuration structures, and modular capabilities.
