        Man & YamStore: Powering a Global Phishing-as-a-Service Ecosystem","description":"Resecurity
        identified and mapped infrastructure supporting a commercial Phishing-as-a-Service
        operation marketed as ''Iron Man System.'' The kit is sold to criminal buyers
        as a self-hosted package deploying pre-built lure pages impersonating postal
        services, banks, government agencies, and other trusted entities. Through
        infiltration of Chinese threat actor communities and acquisition of a license,
        Resecurity traced the back-end infrastructure and found 2,360 phishing templates
        targeting 130 countries. The operation features a self-hosted build registry
        with 911 published versions, bilingual Chinese-English interface, and subscription-based
        licensing tied to vendor-controlled authorization servers. Working with Microsoft''s
        Digital Crimes Unit and industry partners, the cybercriminal infrastructure
        was mapped and disrupted. The kit captured approximately 17.4GB of telemetry
        data targeting 75,000 organizations through an estimated 1 billion phishing
        emails.","author_name":"AlienVault","modified":"2026-10-15T09:51:55.860000","created":"2026-10-15T07:16:15.616000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":3248830927,"indicator":"loveboy.xyz","type":"domain","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3757273663,"indicator":"protonmail.me","type":"domain","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4340656668,"indicator":"docker.aidchildren.cc","type":"hostname","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4528876477,"indicator":"aidchildren.cc","type":"domain","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4528876478,"indicator":"haoeryu.top","type":"domain","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4528876479,"indicator":"api2.haoyutai.cc","type":"hostname","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4528876480,"indicator":"api2.peaceman.cc","type":"hostname","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4528876481,"indicator":"bin2.peaceman.cc","type":"hostname","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4528876482,"indicator":"docker.loveboy.xyz","type":"hostname","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4528876483,"indicator":"install.loveboy.xyz","type":"hostname","created":"2026-10-15T07:16:16","content":"","title":"","description":"","expiration":null,"is_active