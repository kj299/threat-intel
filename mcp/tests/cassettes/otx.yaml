        Targets Major Chinese-Language Phishing Kits with Japanese Focus","description":"A
        coordinated disruption action targeted Chinese-speaking cybercriminals operating
        three major phishing kits: CoGUI, CoAceV, and CoFish_Ws, which collectively
        distributed hundreds of millions of credential phishing messages primarily
        targeting Japanese organizations. These operations impersonated 66 well-known
        brands, mainly consumer and finance companies, to steal usernames, passwords,
        and payment data. The threat actors demonstrated sophisticated capabilities,
        utilizing approximately 17,000 unique domains with frequent rotation and evasion
        techniques. The ecosystem enablers YAM Store and Iron Man were also targeted
        through a civil lawsuit and domain seizures, conducted in collaboration between
        Microsoft, Health-ISAC, and multiple security partners. This coordinated action
        is expected to significantly impact the Chinese phishing ecosystem and cause
        substantial operational disruption to multiple threat groups conducting financial
        fraud.","author_name":"AlienVault","modified":"2026-10-15T09:57:53.928000","created":"2026-10-14T13:44:22.828000","revision":2,"tlp":"white","public":1,"adversary":"YAM
