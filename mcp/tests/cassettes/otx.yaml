      string: '{"results":[{"id":"6ad0096119a185c9dcb055b0","name":"PEERSTITCH, a
        Stealthy FortiGate Implant","description":"A sophisticated multi-stage network
        intrusion against a telecommunications organization in September 2024 exploited
        CVE-2024-47575 on a FortiManager appliance, exfiltrating configurations and
        cryptographic material for over 500 managed FortiGate firewalls. Attackers
        then exploited CVE-2025-61624 to deploy PEERSTITCH, a novel memory-resident
        ARM64 malware that leaves no disk artifacts or network traces. The implant
        operates by patching running processes, creating covert inter-process communication
        channels between system daemons, and intercepting network traffic. Additional
        attack vectors included weaponizing Apache mod_md for reverse shell command
        and control, impersonating the FortiManager platform to compromise downstream
        devices, and deploying extensive anti-forensic measures. The intrusion demonstrates
        advanced tradecraft consistent with nation-state actors, highlighting the
        critical risk of centralized edge management platforms.","author_name":"AlienVault","modified":"2026-10-15T09:53:45.549000","created":"2026-10-14T22:59:45.099000","revision":2,"tlp":"white","public":1,"adversary":"CL-STA-0954","indicators":[{"id":602092,"indicator":"8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92","type":"FileHash-SHA256","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":3996344223,"indicator":"CVE-2024-47575","type":"CVE","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4119535026,"indicator":"CVE-2024-26009","type":"CVE","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4162869271,"indicator":"CVE-2025-59718","type":"CVE","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4162869272,"indicator":"CVE-2025-59719","type":"CVE","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4313419940,"indicator":"CVE-2025-61624","type":"CVE","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4528603189,"indicator":"23.240.77.233","type":"IPv4","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":"2026-11-13T22:00:00","is_active":1,"role":null},{"id":4528603190,"indicator":"47.18.167.159","type":"IPv4","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":"2026-11-13T22:00:00","is_active":1,"role":null},{"id":4528603198,"indicator":"b9fb0b27ddd59b58d3ae53c7227298a3e0de1e6f868b9429ae21533bb9cd1e70","type":"FileHash-SHA256","created":"2026-10-14T22:59:45","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id