        attack"],"targeted_countries":[],"malware_families":["ScreenConnect"],"attack_ids":["T1047","T1056.001","T1036.005","T1204.002","T1543.003","T1566.002","T1598.003","T1566.001","T1082","T1106","T1219","T1055","T1090","T1059","T1553.005","T1566","T1027.002","T1071.001","T1105","T1204.001"],"references":["https:\/\/cofense.com\/blog\/rsvp-to-disaster-how-one-click-installs-a-rat"],"industries":[],"extract_source":[],"more_indicators":false},{"id":"6acec272f01b1f0cac6ecb2a","name":"Clean
        Install, Stolen Creds: Fake WatchGuard VPN Site Serves Genuine Signed Client","description":"In
        early October, a sophisticated credential phishing campaign targeted WatchGuard
        Mobile VPN users through a fake download site at watchguard-vpn[.]net. The
        attack used SEO poisoning to appear in search results and deployed a unique
        technique: after collecting victim credentials twice through browser pop-ups,
        it downloaded the genuine, validly signed WatchGuard installer directly from
        WatchGuard''s official CDN. This eliminated malicious files that security
        tools could detect. The first credential submission was deliberately rejected
        as incorrect to collect multiple passwords. The credential collection endpoint
        at watchguard-ssl[.]online received server addresses, usernames, and passwords,
        providing attackers network access. This domain was previously reported in
        January with no backend functionality but was re-registered in August with
        full phishing capabilities implemented by September.","author_name":"AlienVault","modified":"2026-10-14T06:46:36.532000","created":"2026-10-13T23:44:50.179000","revision":2,"tlp":"white","public":1,"adversary":"Storm-2561","indicators":[{"id":4154879242,"indicator":"watchguard-vpn.com","type":"domain","created":"2026-10-13T23:44:50","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4166178011,"indicator":"watchguard-vpn.net","type":"domain","created":"2026-10-13T23:44:50","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4485343846,"indicator":"www.watchguard-vpn.net","type":"hostname","created":"2026-10-13T23:44:50","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4509675673,"indicator":"watchguard-ssl.online","type":"domain","created":"2026-10-13T23:44:50","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4526831654,"indicator":"http:\/\/watchguard-vpn.net\/index.php","type":"URL","created":"2026-10-13T23:44:50","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4526831655,"indicator":"https:\/\/www.watchguard-vpn.net\/","type":"URL","created":"2026-10-13T23:44:50","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["watchguard
        impersonation","signed installer abuse","fake download site","seo poisoning","credential
        phishing","browser pop-up","vpn targeting"],"targeted_countries":[],"malware_families":[],"attack_ids":["T1583","T1568.002","T1036.005","T1566.002","T1598.003","T1071","T1583.001","T1036","T1185","T1078.001","T1568","T1204","T1566","T1078","T1598","T1213","T1189","T1071.001","T1204.001"],"references":["https:\/\/www.huntress.com\/blog\/fake-watchguard-vpn-credential-phishing"],"industries":[],"extract_source":[],"more_indicators":false},{"id":"6acf002e7c7fddeb927af2d8","name":"Statistical
        Report on Malware Targeting Linux SSH Servers in the Third Quarter of 2026","description":"During
        the third quarter of 2026, multiple attack campaigns targeted poorly managed
        Linux SSH servers using brute force, dictionary attacks, and vulnerability
        exploits. Threat actors deployed ShellBot, a Perl-based DDoS bot, utilizing
        C&C servers at specific IP addresses with capabilities including port scanning
        and UDP flooding. A sophisticated attack chain involved launcher malware that
        executed user-mode rootkit libSSL2.3.0.So via \/etc\/ld.so.preload, subsequently
        deploying XMRig cryptocurrency miner disguised as -bash using XHide process
        concealment tool. Additionally, Fisieredoor backdoor was deployed, capable
        of command execution and installing SSH brute-force tools including goauto
