        a brand deal scam targeting YouTube creators","description":"A sophisticated
        phishing campaign targets YouTube content creators through personalized sponsorship
        emails impersonating legitimate brands like Hollyland, Nike, and Spotify.
        Attackers send customized collaboration offers referencing specific videos
        from targets'' channels, then direct them to fraudulent platforms that appear
        legitimate with campaign metrics and income calculators. The scheme culminates
        in a Google sign-in request that either captures credentials directly or requests
        excessive account permissions. Once compromised, attackers lock victims out
        by changing recovery methods and can misuse the account to spread scams to
        followers. The modular campaign operates globally, targeting creators in Peru,
        Japan, and English-speaking regions, using multiple domains while maintaining
        similar functionality and design patterns across variants.","author_name":"AlienVault","modified":"2026-10-12T23:25:08.274000","created":"2026-10-12T01:30:11.108000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4516371656,"indicator":"matchyjoin.com","type":"domain","created":"2026-10-12T01:30:11","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4516371657,"indicator":"joinmatchy.com","type":"domain","created":"2026-10-12T01:30:11","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4523260739,"indicator":"http:\/\/joinmatchy.com\/hollyland","type":"URL","created":"2026-10-12T01:30:11","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["google
        account compromise","sso abuse","social engineering","youtube creators","sponsorship
        scam","credential theft","brand impersonation","phishing campaign"],"targeted_countries":["Japan","Peru"],"malware_families":[],"attack_ids":[],"references":["https:\/\/www.welivesecurity.com\/en\/social-media\/brand-deal-scam-targeting-youtube-creators\/"],"industries":["Media"],"extract_source":[],"more_indicators":false},{"id":"6ac9eef4bcc05a59cd402770","name":"Threat
        Overview: NetScaler Zero Days CVE-2026-88771 and CVE-2026-88772 Being Exploited
        in Production Environments (Updated September 30)","description":"Two critical
        zero-day vulnerabilities in NetScaler ADC and Gateway systems are being actively
        exploited in the wild. CVE-2026-88771 is a remote code execution vulnerability
        allowing unauthenticated command injection, while CVE-2026-88772 is a DTLS
        memory overflow flaw enabling RCE or DoS attacks. Threat actors deployed webshells
        through these vulnerabilities to establish initial access and persistence.
        The CVE-2026-88771 exploitation involves a three-stage command injection chain
        poisoning log files, while CVE-2026-88772 exploitation drops .deb webshell
        files. Attackers used PHP webshells with RC4 encryption for command and control
        communications, targeting custom directories within NetScaler Gateway interfaces.
        Cortex Xpanse identified over 50,000 potentially vulnerable exposed instances.","author_name":"AlienVault","modified":"2026-10-12T23:22:02.758000","created":"2026-10-10T07:53:24.053000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":4146640726,"indicator":"CVE-2025-21042","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4157551390,"indicator":"CVE-2025-55182","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4157557343,"indicator":"CVE-2025-66478","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4171606903,"indicator":"CVE-2025-14847","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4190230304,"indicator":"CVE-2026-1281","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4191150824,"indicator":"CVE-2026-1340","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4200504512,"indicator":"CVE-2026-1731","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4214691492,"indicator":"CVE-2025-0921","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4214691493,"indicator":"CVE-2025-23304","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4214691495,"indicator":"CVE-2026-22584","type":"CVE","created":"2026-10-10T07:53:24","content":"","title":"","description":"","expiration":null,