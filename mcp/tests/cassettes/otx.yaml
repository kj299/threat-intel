        as C2 in Noir, An AI-Developed Crypto Wallet Drainer","description":"A cryptocurrency
        wallet-drainer kit called Noir uses DNS TXT records and DNS-over-HTTPS (DoH)
        as a dynamic command-and-control mechanism. The loader queries public DoH
        services to discover active infrastructure hosted on Cloudflare Pages, allowing
        operators to redirect deployed lures by changing a single DNS record. The
        drainer does not require victims to enter seed phrases or private keys; instead,
        it requests wallet connection permissions and obtains spending approvals that
        appear less suspicious than direct transfers. The architecture separates long-lived
        phishing lures from short-lived operational infrastructure, with 60-second
        DNS caching and self-healing retry logic. Extensive plain-English code comments
        suggest AI-assisted development, documenting bugs, fixes, and design decisions.
        The kit serves as a shared service across multiple cryptocurrency-themed phishing
        campaigns.","author_name":"AlienVault","modified":"2026-10-12T23:10:55.357000","created":"2026-10-09T22:03:27.940000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":2862900811,"indicator":"noir.black","type":"domain","created":"2026-10-09T22:03:28","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4519618472,"indicator":"r.noir.black","type":"hostname","created":"2026-10-09T22:03:28","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["wallet
        permissions","cryptocurrency drainer","noir","doh abuse","ai-developed","dns
        over https","command and control","dns txt records","crypto phishing","cloudflare
        pages"],"targeted_countries":[],"malware_families":["Noir"],"attack_ids":["T1132.001","T1059.007","T1568.002","T1071.004","T1497.001","T1566.002","T1598.003","T1071","T1140","T1055","T1102","T1566","T1027","T1102.002","T1204.001","T1102.001"],"references":["https:\/\/www.infoblox.com\/blog\/threat-intelligence\/when-a-wallet-drainer-asks-dns-where-to-go\/"],"industries":[],"extract_source":[],"more_indicators":false},{"id":"6ac9101554900e3ae83df111","name":"The
        Scalpel vs. The Sledgehammer: Lessons in Precision Triage from the .conf26
        SOC","description":"During a live Security Operations Center shift at .conf26
        in Denver, analysts investigated Incident ES_00244 involving an exploit link
        detected by Cisco Secure Firewall. The challenge arose when 15 devices were
        found communicating with a single IP address (13.226.251.40) flagged for hosting
        malicious domains moonlighthathel[.]org and ukankingwithea[.]com. Investigation
        revealed the IP was an Amazon CloudFront CDN node simultaneously serving legitimate
        services including Samsung Health, Mindtickle learning platform, and Amazon
        Video. Using AI-assisted analysis, firewall logs, and packet forensics through
        Endace, analysts isolated one unmanaged Intel laptop generating malicious
        traffic among 14 benign connections. Instead of blocking the shared IP and
        disrupting legitimate services, analysts implemented precise DNS object blocks
        targeting only the malicious domains at the Cisco Firepower Threat Defense
        perimeter, successfully neutralizing the threat while maintaining normal operations
        for all other attendees.","author_name":"AlienVault","modified":"2026-10-12T23:05:38.825000","created":"2026-10-09T16:02:29.260000","revision":2,"tlp":"white","public":1,"adversary":"","indicators":[{"id":3325076393,"indicator":"CVE-2021-44228","type":"CVE","created":"2026-10-09T16:02:29","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4519005679,"indicator":"https:\/\/moonlighthathel.org","type":"URL","created":"2026-10-09T16:02:29","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null},{"id":4519005681,"indicator":"https:\/\/ukankingwithea.com","type":"URL","created":"2026-10-09T16:02:29","content":"","title":"","description":"","expiration":null,"is_active":1,"role":null}],"tags":["conference
