        {"cve": {"id": "CVE-2019-1952", "sourceIdentifier": "psirt@cisco.com", "published":
        "2019-08-08T08:15:12.333", "lastModified": "2026-08-24T18:22:58.150", "vulnStatus":
        "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value": "A vulnerability
        in the CLI of Cisco Enterprise NFV Infrastructure Software (NFVIS) could allow
        an authenticated, local attacker to overwrite or read arbitrary files. The
        attacker would need valid administrator privilege-level credentials. This
        vulnerability is due to improper input validation of CLI command arguments.
        An attacker could exploit this vulnerability by using directory traversal
        techniques when executing a vulnerable command. A successful exploit could
        allow the attacker to overwrite or read arbitrary files on an affected device."},
        {"lang": "es", "value": "Una vulnerabilidad en la CLI de Enterprise NFV Infrastructure
        Software (NFVIS) de Cisco, podr\u00eda permitir a un atacante local autenticado
        sobrescribir o leer archivos arbitrarios. El atacante necesitar\u00eda credenciales
        v\u00e1lidas de nivel de privilegio de administrador. Esta vulnerabilidad
        es debido a una comprobaci\u00f3n de entrada inapropiada de argumentos de
        comando de la CLI. Un atacante podr\u00eda explotar esta vulnerabilidad mediante
        el uso de t\u00e9cnicas de salto de directorio cuando se ejecuta un comando
        vulnerable. Una explotaci\u00f3n con \u00e9xito podr\u00eda permitir al atacante
        sobrescribir o leer archivos arbitrarios en un dispositivo afectado."}], "affected":
