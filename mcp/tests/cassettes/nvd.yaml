        "published": "2019-08-07T21:15:11.283", "lastModified": "2026-08-24T18:22:58.150",
        "vulnStatus": "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "A vulnerability in the Virtual Network Computing (VNC) console implementation
        of Cisco Enterprise NFV Infrastructure Software (NFVIS) could allow an unauthenticated,
        remote attacker to access the VNC console session of an administrative user
        on an affected device. The vulnerability is due to an insufficient authentication
        mechanism used to establish a VNC session. An attacker could exploit this
        vulnerability by intercepting an administrator VNC session request prior to
        login. A successful exploit could allow the attacker to watch the administrator
        console session or interact with it, allowing admin access to the affected
        device."}, {"lang": "es", "value": "Una vulnerabilidad en la implementaci\u00f3n
        de la consola de Virtual Network Computing (VNC) de Enterprise NFV Infrastructure
        Software (NFVIS) de Cisco, podr\u00eda permitir a un atacante remoto no autenticado
        acceder a la sesi\u00f3n de consola VNC de un usuario administrativo en un
        dispositivo afectado. La vulnerabilidad es debido a un mecanismo de autenticaci\u00f3n
        insuficiente utilizado para establecer una sesi\u00f3n VNC. Un atacante podr\u00eda
        explotar esta vulnerabilidad mediante la intercepci\u00f3n de una petici\u00f3n
        de sesi\u00f3n VNC de administrador antes de iniciar sesi\u00f3n. Una explotaci\u00f3n
        con \u00e9xito podr\u00eda permitir al atacante visualizar la sesi\u00f3n
        de la consola del administrador o interactuar con ella, permitiendo el acceso
        del administrador al dispositivo afectado."}], "affected": [{"source": "psirt@cisco.com",
        "affectedData": [{"vendor": "Cisco", "product": "Cisco Enterprise NFV Infrastructure
        Software", "versions": [{"version": "unspecified", "lessThan": "3.12.1", "versionType":
