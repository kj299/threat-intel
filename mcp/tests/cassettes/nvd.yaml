        [], "descriptions": [{"lang": "en", "value": "The getgrav/grav-plugin-api
        Composer package before 1.0.13 (affected <= 1.0.12) fails to enforce API key
        scope caps on the disable2fa endpoint. Unlike the sibling generate2fa endpoint,
        disable2fa authorizes the admin (non-self) path solely via ACL reads (isSuperAdmin/hasPermission)
        and never invokes requirePermission(), so the api_key_scopes cap is never
        applied. As a result, a holder of a narrow-scope API key on a super account,
        or a non-super account whose ACL includes api.users.write, can force-disable
        two-factor authentication on any non-super target account via POST /api/v1/users/{user}/2fa/disable
        without providing a TOTP code, facilitating account takeover."}], "affected":
        [{"source": "disclosure@vulncheck.com", "affectedData": [{"vendor": "getgrav",
