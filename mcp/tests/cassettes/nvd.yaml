        [{"lang": "en", "value": "Spring Data Commons, versions prior to 1.13 to 1.13.10,
        2.0 to 2.0.5, and older unsupported versions, contain a property binder vulnerability
        caused by improper neutralization of special elements. An unauthenticated
        remote malicious user (or attacker) can supply specially crafted request parameters
        against Spring Data REST backed HTTP resources or using Spring Data''s projection-based
        request payload binding hat can lead to a remote code execution attack."},
        {"lang": "es", "value": "Spring Data Commons, en versiones anteriores a las
        comprendidas entre la 1.13 y la 1.13.10 y entre la 2.0 y la 2.0.5 y versiones
        antiguas no soportadas, contiene una vulnerabilidad Property Binder debido
        a una neutralizaci\u00f3n incorrecta de los elementos especiales. Un usuario
        (o atacante) remoto no autenticado puede pasar par\u00e1metros de petici\u00f3n
        especialmente manipulados contra los recursos HTTP respaldados con datos REST
        de Spring o utilizar el hat de vinculaci\u00f3n de la carga \u00fatil de la
        petici\u00f3n basada en la proyecci\u00f3n para permitir un ataque de ejecuci\u00f3n
        remota de c\u00f3digo."}], "affected": [{"source": "security_alert@emc.com",
