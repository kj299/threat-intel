        {"cve": {"id": "CVE-2019-1946", "sourceIdentifier": "psirt@cisco.com", "published":
        "2019-08-08T08:15:12.147", "lastModified": "2026-08-24T18:22:58.150", "vulnStatus":
        "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value": "A vulnerability
        in the web-based management interface of Cisco Enterprise NFV Infrastructure
        Software (NFVIS) could allow an unauthenticated, remote attacker to bypass
        authentication and get limited access to the web-based management interface.
        The vulnerability is due to an incorrect implementation of authentication
        in the web-based management interface. An attacker could exploit this vulnerability
        by sending a crafted authentication request to the web-based management interface
        on an affected system. A successful exploit could allow the attacker to view
        limited configuration details and potentially upload a virtual machine image."},
        {"lang": "es", "value": "Una vulnerabilidad en la interfaz de administraci\u00f3n
        basada en web de Enterprise NFV Infrastructure Software (NFVIS) de Cisco,
        podr\u00eda permitir a un atacante remoto no autenticado omitir la autenticaci\u00f3n
        y obtener acceso limitado a la interfaz de administraci\u00f3n basada en web.
        La vulnerabilidad es debido a una implementaci\u00f3n incorrecta de la autenticaci\u00f3n
        en la interfaz de administraci\u00f3n basada en web. Un atacante podr\u00eda
        explotar esta vulnerabilidad mediante el env\u00edo de una petici\u00f3n de
        autenticaci\u00f3n dise\u00f1ada hacia la interfaz de administraci\u00f3n
        basada en web en un sistema afectado. Una explotaci\u00f3n con \u00e9xito
        podr\u00eda permitir al atacante visualizar detalles de configuraci\u00f3n
        limitados y potencialmente cargar una imagen de la m\u00e1quina virtual."}],
        "affected": [{"source": "psirt@cisco.com", "affectedData": [{"vendor": "Cisco",
