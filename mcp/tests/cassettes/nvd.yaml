        "In the Linux kernel, the following vulnerability has been resolved:\n\nInput:
        ims-pcu - fix race condition in reset_device sysfs callback\n\nThe ims_pcu_reset_device()
        sysfs callback calls ims_pcu_execute_command()\nwithout acquiring pcu->cmd_mutex.
        This can lead to data races and\ncorruption of the shared command buffer if
        triggered concurrently with\nother commands.\n\nAcquire pcu->cmd_mutex before
        calling ims_pcu_execute_command()."}], "affected": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67",
