        {"cve": {"id": "CVE-2021-3506", "sourceIdentifier": "secalert@redhat.com",
        "published": "2021-04-19T22:15:13.110", "lastModified": "2026-09-01T18:04:20.630",
        "vulnStatus": "Analyzed", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "An out-of-bounds (OOB) memory access flaw was found in fs/f2fs/node.c in
        the f2fs module in the Linux kernel in versions before 5.12.0-rc4. A bounds
        check failure allows a local attacker to gain access to out-of-bounds memory
        leading to a system crash or a leak of internal kernel information. The highest
        threat from this vulnerability is to system availability."}, {"lang": "es",
        "value": "Se encontr\u00f3 un fallo de acceso a la memoria fuera de l\u00edmites
        (OOB) en el archivo fs/f2fs/node.c en el m\u00f3dulo f2fs en el kernel de
        Linux en versiones anteriores a 5.12.0-rc4.&#xa0;Un fallo en la comprobaci\u00f3n
        de l\u00edmites permite a un atacante local conseguir acceso a la memoria
        fuera de l\u00edmites, conllevando a un bloqueo del sistema o una fuga de
        informaci\u00f3n interna del kernel.&#xa0;La mayor amenaza de esta vulnerabilidad
        es la disponibilidad del sistema"}], "affected": [{"source": "secalert@redhat.com",
