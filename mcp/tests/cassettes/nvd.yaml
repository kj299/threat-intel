        "published": "2017-08-08T15:29:01.380", "lastModified": "2026-08-25T16:28:27.310",
        "vulnStatus": "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "Vulnerability in the Oracle Agile PLM component of Oracle Supply Chain Products
        Suite (subcomponent: Web Client). Supported versions that are affected are
        9.3.5 and 9.3.6. Easily exploitable vulnerability allows low privileged attacker
        with network access via HTTP to compromise Oracle Agile PLM. Successful attacks
        require human interaction from a person other than the attacker and while
        the vulnerability is in Oracle Agile PLM, attacks may significantly impact
        additional products. Successful attacks of this vulnerability can result in
        unauthorized access to critical data or complete access to all Oracle Agile
        PLM accessible data. CVSS 3.0 Base Score 6.8 (Confidentiality impacts). CVSS
        Vector: (CVSS:3.0/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:N/A:N)."}, {"lang": "es",
        "value": "Vulnerabilidad en el componente Oracle Agile PLM de Oracle Supply
        Chain Products Suite (subcomponente: Web Client). Las versiones compatibles
        que se han visto afectadas son la 9.3.5 y la 9.3.6. Una vulnerabilidad f\u00e1cilmente
        explotable permite que un atacante con un bajo nivel de privilegios que tenga
        acceso a red por HTTP comprometa la seguridad de Oracle Agile PLM. Para que
        los ataques tengan \u00e9xito, se necesita la participaci\u00f3n de otra persona
        diferente del atacante y, aunque la vulnerabilidad est\u00e1 presente en Oracle
        Agile PLM, los ataques podr\u00edan afectar seriamente a productos adicionales.
        Los ataques exitosos a esta vulnerabilidad pueden resultar en un acceso no
        autorizado a datos de suma importancia o un acceso completo a todos los datos
        accesibles de Oracle Agile PLM. CVSS 3.0 Base Score 6.8 (impactos en la confidencialidad).
        Vector CVSS: (CVSS:3.0/AV:N/AC:L/PR:L/UI:R/S:C/C:H/I:N/A:N)."}], "affected":
