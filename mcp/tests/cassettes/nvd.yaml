        {"cve": {"id": "CVE-2019-1953", "sourceIdentifier": "psirt@cisco.com", "published":
        "2019-08-08T08:15:12.413", "lastModified": "2026-08-24T18:22:58.150", "vulnStatus":
        "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value": "A vulnerability
        in the web portal of Cisco Enterprise NFV Infrastructure Software (NFVIS)
        could allow an authenticated, remote attacker to view a password in clear
        text. The vulnerability is due to incorrectly logging the admin password when
        a user is forced to modify the default password when logging in to the web
        portal for the first time. Subsequent password changes are not logged and
        other accounts are not affected. An attacker could exploit this vulnerability
        by viewing the admin clear text password and using it to access the affected
        system. The attacker would need a valid user account to exploit this vulnerability."},
        {"lang": "es", "value": "Una vulnerabilidad en el portal web de Enterprise
        NFV Infrastructure Software (NFVIS) de Cisco, podr\u00eda permitir a un atacante
        remoto autenticado visualizar una contrase\u00f1a en texto sin cifrar. La
        vulnerabilidad es debido al inicio de sesi\u00f3n incorrecto de la contrase\u00f1a
        de administrador cuando un usuario es forzado a modificar la contrase\u00f1a
        predeterminada al iniciar sesi\u00f3n en el portal web por primera vez. Los
        cambios de contrase\u00f1a posteriores no son registrados y otras cuentas
        no son afectadas. Un atacante podr\u00eda explotar esta vulnerabilidad al
        visualizar la contrase\u00f1a de texto sin cifrar del administrador y usarla
        para acceder al sistema afectado. El atacante necesitar\u00eda una cuenta
        de usuario v\u00e1lida para explotar esta vulnerabilidad."}], "affected":
        [{"source": "psirt@cisco.com", "affectedData": [{"vendor": "Cisco", "product":
