        {"cve": {"id": "CVE-2022-4696", "sourceIdentifier": "cve-coordination@google.com",
        "published": "2023-01-11T13:15:09.307", "lastModified": "2026-09-01T18:05:07.353",
        "vulnStatus": "Analyzed", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "There exists a use-after-free vulnerability in the Linux kernel through io_uring
        and the\u00a0IORING_OP_SPLICE operation. If\u00a0IORING_OP_SPLICE is\u00a0missing
        the IO_WQ_WORK_FILES flag, which signals that the operation won''t use current->nsproxy,
        so its reference counter is not increased. This assumption is not always true
        as calling io_splice on specific files will call the get_uts function which
        will use current->nsproxy leading to invalidly decreasing its reference counter
        later causing the use-after-free vulnerability. We recommend upgrading to
        version 5.10.160 or above\n"}, {"lang": "es", "value": "Existe una vulnerabilidad
        de use-after-free en el kernel de Linux a trav\u00e9s de io_uring y la operaci\u00f3n
        IORING_OP_SPLICE. Si a IORING_OP_SPLICE le falta el indicador IO_WQ_WORK_FILES,
        que indica que la operaci\u00f3n no utilizar\u00e1 current-&gt;nsproxy, por
        lo que su contador de referencia no aumenta. Esta suposici\u00f3n no siempre
        es cierta, ya que llamar a io_splice en archivos espec\u00edficos llamar\u00e1
        a la funci\u00f3n get_uts, que utilizar\u00e1 current-&gt;nsproxy, lo que
        provocar\u00e1 una disminuci\u00f3n no v\u00e1lida de su contador de referencia
        y luego provocar\u00e1 la vulnerabilidad de use-after-free. Recomendamos actualizar
        a la versi\u00f3n 5.10.160 o superior"}], "affected": [{"source": "cve-coordination@google.com",
