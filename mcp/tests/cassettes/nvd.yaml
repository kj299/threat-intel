        "support@hackerone.com", "published": "2021-05-26T19:15:08.643", "lastModified":
        "2026-08-31T17:54:28.843", "vulnStatus": "Analyzed", "cveTags": [], "descriptions":
        [{"lang": "en", "value": "In Versa Analytics, the cron jobs are used for scheduling
        tasks by executing commands at specific dates and times on the server. If
        the job is run as the user root, there is a potential privilege escalation
        vulnerability. In this case, the job runs a script as root that is writable
        by users who are members of the versa group."}, {"lang": "es", "value": "En
        Versa Analytics, los trabajos cron son utilizados para programar tareas ejecutando
        comandos en fechas y horas espec\u00edficas en el servidor.&#xa0;Si el trabajo
        se ejecuta como usuario root, se presenta una potencial vulnerabilidad de
        escalada de privilegios.&#xa0;En este caso, el trabajo ejecuta un script como
        root que es escribible por usuarios que son miembros del grupo versa"}], "affected":
