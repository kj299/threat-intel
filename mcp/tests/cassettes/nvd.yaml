        [{"lang": "en", "value": "Spring Framework (versions 5.0.x prior to 5.0.7,
        versions 4.3.x prior to 4.3.18, and older unsupported versions) allow web
        applications to change the HTTP request method to any HTTP method (including
        TRACE) using the HiddenHttpMethodFilter in Spring MVC. If an application has
        a pre-existing XSS vulnerability, a malicious user (or attacker) can use this
        filter to escalate to an XST (Cross Site Tracing) attack."}, {"lang": "es",
        "value": "Spring Framework (versiones 5.0.x anteriores a la 5.0.7, versiones
        4.3.x anteriores a la 4.3.18 y versiones anteriores sin soporte) permite que
        las aplicaciones web cambien el m\u00e9todo de petici\u00f3n HTTP a cualquier
        m\u00e9todo HTTP (incluyendo TRACE) utilizando HiddenHttpMethodFilter en Spring
        MVC. Si una aplicaci\u00f3n tiene una vulnerabilidad Cross-Site Scripting
        (XSS) preexistente, un usuario (o atacante) malicioso puede emplear este filtro
        para escalar a un ataque XST (Cross Site Tracing)."}], "affected": [{"source":
