        {"cve": {"id": "CVE-2019-1972", "sourceIdentifier": "psirt@cisco.com", "published":
        "2019-08-08T08:15:13.070", "lastModified": "2026-08-24T18:22:58.150", "vulnStatus":
        "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value": "A vulnerability
        the Cisco Enterprise NFV Infrastructure Software (NFVIS) restricted CLI could
        allow an authenticated, local attacker with valid administrator-level credentials
        to elevate privileges and execute arbitrary commands on the underlying operating
        system as root. The vulnerability is due to insufficient restrictions during
        the execution of an affected CLI command. An attacker could exploit this vulnerability
        by leveraging the insufficient restrictions during the execution of an affected
        command. A successful exploit could allow the attacker to elevate privileges
        and execute arbitrary commands on the underlying operating system as root."},
        {"lang": "es", "value": "Una vulnerabilidad de la CLI restringida en Enterprise
        NFV Infrastructure Software (NFVIS) de Cisco, podr\u00eda permitir a un atacante
        local autenticado con credenciales v\u00e1lidas de nivel de administrador
        escalar los privilegios y ejecutar comandos arbitrarios en el sistema operativo
        subyacente como root. La vulnerabilidad es debido a restricciones insuficientes
        durante la ejecuci\u00f3n de un comando de la CLI afectado. Un atacante podr\u00eda
        explotar esta vulnerabilidad aprovechando las restricciones insuficientes
        durante la ejecuci\u00f3n de un comando afectado. Una explotaci\u00f3n con
        \u00e9xito podr\u00eda permitir al atacante escalar los privilegios y ejecutar
        comandos arbitrarios en el sistema operativo subyacente como root."}], "affected":
