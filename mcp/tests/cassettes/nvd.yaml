        "VDB Entry"]}]}}, {"cve": {"id": "CVE-2020-5411", "sourceIdentifier": "security@pivotal.io",
        "published": "2020-06-11T17:15:12.410", "lastModified": "2026-09-01T18:07:18.263",
        "vulnStatus": "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "When configured to enable default typing, Jackson contained a deserialization
        vulnerability that could lead to arbitrary code execution. Jackson fixed this
        vulnerability by blacklisting known \"deserialization gadgets\". Spring Batch
        configures Jackson with global default typing enabled which means that through
        the previous exploit, arbitrary code could be executed if all of the following
        is true: * Spring Batch''s Jackson support is being leveraged to serialize
        a job''s ExecutionContext. * A malicious user gains write access to the data
        store used by the JobRepository (where the data to be deserialized is stored).
        In order to protect against this type of attack, Jackson prevents a set of
        untrusted gadget classes from being deserialized. Spring Batch should be proactive
        against blocking unknown \"deserialization gadgets\" when enabling default
        typing."}, {"lang": "es", "value": "Cuando se configur\u00f3 para habilitar
        la escritura predeterminada, Jackson conten\u00eda una vulnerabilidad de deserializaci\u00f3n
        que podr\u00eda conllevar a una ejecuci\u00f3n de c\u00f3digo arbitraria.
        Jackson corrigi\u00f3 esta vulnerabilidad al incluir en la lista negra los
        \"deserialization gadgets\" conocidos. Spring Batch configura Jackson con
        la escritura predeterminada global habilitada, lo que significa que por medio
        de una explotaci\u00f3n previa, se podr\u00eda ejecutar un c\u00f3digo arbitrario
        si se cumple todo lo siguiente: * El soporte Jackson de Spring Batch se est\u00e1
        siendo aprovechado para serializar un ExecutionContext de trabajo. * Un usuario
        malicioso consigue acceso de escritura al almac\u00e9n de datos usado por
        JobRepository (donde se almacenan los datos que son deserializados). A fin
        de protegerse contra este tipo de ataque, Jackson evita que se deserialice
        un conjunto de clases de gadget no confiables. Spring Batch debe ser proactivo
        contra el bloqueo de \"deserialization gadgets\" desconocidos cuando se habilita
        una escritura predeterminada"}], "affected": [{"source": "security@pivotal.io",
        "affectedData": [{"vendor": "Spring by VMware", "product": "Spring Batch",
        "versions": [{"version": "4", "lessThan": "4.2.3", "versionType": "custom",
