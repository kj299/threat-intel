        [], "descriptions": [{"lang": "en", "value": "The Grav API plugin (getgrav/grav-plugin-api)
        versions >= 1.0.6 and <= 1.0.11 contain a privilege escalation vulnerability.
        A scoped API key minted on a super-admin account bypasses its declared scope
        cap on four isSuperAdmin()-gated write endpoints (in GroupsController, AccountsConfigController,
        PreferencesController, and DashboardWidgetController). These endpoints authorize
        via a super-admin early-return that never invokes requirePermission()\u2014the
        sole enforcement point of the scope cap\u2014so a ''read-only''-scoped key
        (e.g. api.pages.read) can perform super-only write operations, including rewriting
        group ACL maps to grant super-admin privileges to arbitrary accounts. A leaked
        or delegated read-only CI/monitoring key can therefore gain full super-admin
        write capability. Fixed in 1.0.13."}], "affected": [{"source": "disclosure@vulncheck.com",
