        {"cve": {"id": "CVE-2020-8619", "sourceIdentifier": "security-officer@isc.org",
        "published": "2020-06-17T22:15:13.070", "lastModified": "2026-09-01T20:57:40.370",
        "vulnStatus": "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "In ISC BIND9 versions BIND 9.11.14 -> 9.11.19, BIND 9.14.9 -> 9.14.12, BIND
        9.16.0 -> 9.16.3, BIND Supported Preview Edition 9.11.14-S1 -> 9.11.19-S1:
        Unless a nameserver is providing authoritative service for one or more zones
        and at least one zone contains an empty non-terminal entry containing an asterisk
        (\"*\") character, this defect cannot be encountered. A would-be attacker
        who is allowed to change zone content could theoretically introduce such a
        record in order to exploit this condition to cause denial of service, though
        we consider the use of this vector unlikely because any such attack would
        require a significant privilege level and be easily traceable."}, {"lang":
        "es", "value": "En las versiones ISC BIND9 BIND 9.11.14 -&gt; 9.11.19, BIND
        9.14.9 -&gt; 9.14.12, BIND 9.16.0 -&gt; 9.16.3, BIND Supported Preview Edition
        9.11.14-S1 -&gt; 9.11.19-S1: A menos que un servidor de nombres proporcione
        un servicio autorizado para una o m\u00e1s zonas y al menos una zona contenga
        una entrada sin terminal vac\u00eda que contenga un car\u00e1cter asterisco
        (\"*\"), este defecto no puede ser encontrado. Un posible atacante al que
        se le permite cambiar el contenido de la zona, podr\u00eda introducir te\u00f3ricamente
        dicho registro para explotar esta condici\u00f3n y causar una denegaci\u00f3n
        de servicio, aunque consideramos que el uso de este vector es poco probable
        porque cualquier ataque requerir\u00eda de un nivel de privilegio significativo
        y que sea f\u00e1cilmente rastreable"}], "affected": [{"source": "security-officer@isc.org",
        "affectedData": [{"vendor": "ISC", "product": "BIND9", "versions": [{"version":
        "9.11.14 through versions before 9.11.20", "status": "affected"}, {"version":
        "9.16.0 through versions before 9.16.4", "status": "affected"}, {"version":
        "9.11.14-S1 through versions before 9.11.20-S1", "status": "affected"}, {"version":
