        "lastModified": "2026-09-02T11:17:24.510", "vulnStatus": "Received", "cveTags":
        [], "descriptions": [{"lang": "en", "value": "Net::DNS versions before 1.57
        for Perl allow memory exhaustion via unbounded recursion in sig_data when
        re-encoding a message with a misplaced TSIG record.\n\nsig_data signs a message
        by re-encoding it, and removes TSIG records only from the additional section.
        A TSIG decoded into the answer or authority section survives that step and
        is signed again, so encoding re-enters sig_data with no termination condition.
        Decoding does not reject such a message: a TSIG that is not the last record
        on the wire raises \"misplaced or corrupt TSIG\", but the error is caught,
        reported as a warning, and the record is left in the packet. RFC 8945 section
        5.2 requires the message to be dropped.\n\nThe recursion is reached only when
        the decoded TSIG carries an empty MAC, since a MAC recovered from the wire
        short-circuits the signing step. It is reached only from code that re-encodes
        a message it decoded, such as a forwarder or a proxy. A decoded message that
        is never re-encoded is unaffected. Message direction does not matter: a query
        reaches the same path as a response.\n\nEach cycle re-encodes the whole message,
        so fewer than 100 bytes on the wire exhaust available memory and terminate
        the process."}], "affected": [{"source": "9b29abf9-4ab0-4765-b253-1875cd9b441e",
        "affectedData": [{"defaultStatus": "unaffected", "collectionURL": "https://cpan.org/modules",
