        [], "descriptions": [{"lang": "en", "value": "KEDA is a Kubernetes-based Event
        Driven Autoscaling component. Prior to 2.20.0, pkg/scalers/postgresql_scaler.go
        constructs libpq-style connection strings from tenant-controlled host, port,
        userName, dbName, sslmode, and password values, while escapePostgreConnectionParameter()
        only quotes values containing a literal space. Tabs, newlines, carriage returns,
