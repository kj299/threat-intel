        "vulnStatus": "Analyzed", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "A vulnerability has been found in Linux Kernel up to 5.10.162/5.15.85/6.0.15/6.1.1.
        The impacted element is the function btf_dump_name_dups of the file tools/lib/bpf/btf_dump.c
        of the component libbpf. The manipulation leads to use after free. Upgrading
        to version 5.10.163, 5.15.86, 6.0.16, 6.1.2 and 6.2 is sufficient to resolve
        this issue. The identifier of the patch is c61650b869e0b6fb0c0a28ed42d928eea969afc8/fbe08093fb2334549859829ef81d42570812597d/8c64a8e76eb85d422af5ec60ccbf26e3ead8c333/a733bf10198eb5bb927890940de8ab457491ed3b/93c660ca40b5d2f7c1b1626e955a8e9fa30e0749.
        You should upgrade the affected component."}, {"lang": "es", "value": "Se
        ha encontrado una vulnerabilidad clasificada como cr\u00edtica en el Kernel
        de Linux. Est\u00e1 afectada la funci\u00f3n btf_dump_name_dups del archivo
        tools/lib/bpf/btf_dump.c del componente libbpf. La manipulaci\u00f3n conlleva
        a un uso de memoria previamente liberada. Es recomendado aplicar un parche
        para corregir este problema. El identificador de esta vulnerabilidad es VDB-211032"}],
