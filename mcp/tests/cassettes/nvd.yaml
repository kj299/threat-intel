        Party Advisory"]}]}}, {"cve": {"id": "CVE-2018-15756", "sourceIdentifier":
        "security_alert@emc.com", "published": "2018-10-18T22:29:00.443", "lastModified":
        "2026-08-25T16:28:27.310", "vulnStatus": "Modified", "cveTags": [], "descriptions":
        [{"lang": "en", "value": "Spring Framework, version 5.1, versions 5.0.x prior
        to 5.0.10, versions 4.3.x prior to 4.3.20, and older unsupported versions
        on the 4.2.x branch provide support for range requests when serving static
        resources through the ResourceHttpRequestHandler, or starting in 5.0 when
        an annotated controller returns an org.springframework.core.io.Resource. A
        malicious user (or attacker) can add a range header with a high number of
        ranges, or with wide ranges that overlap, or both, for a denial of service
        attack. This vulnerability affects applications that depend on either spring-webmvc
        or spring-webflux. Such applications must also have a registration for serving
        static resources (e.g. JS, CSS, images, and others), or have an annotated
        controller that returns an org.springframework.core.io.Resource. Spring Boot
        applications that depend on spring-boot-starter-web or spring-boot-starter-webflux
        are ready to serve static resources out of the box and are therefore vulnerable."},
        {"lang": "es", "value": "Spring Framework 5.1, versiones 5.0.x anteriores
        a la 5.0.10, versiones 4.3.x anteriores a la 4.3.20 y versiones anteriores
        no soportadas en la rama de versiones 4.2.x proporciona soporte para peticiones
        de rango al servir recursos est\u00e1ticos mediante ResourceHttpRequestHandler
        o, desde la versi\u00f3n 5.0, cuando un controlador anotado devuelve org.springframework.core.io.Resource.
        Un usuario (o atacante) malicioso puede a\u00f1adir una cabecera de rango
        con un alto n\u00famero de rangos o con rangos amplios que se superponen,
        o ambos, para provocar un ataque de denegaci\u00f3n de servicio (DoS). Esta
        vulnerabilidad afecta a aplicaciones que dependen de spring-webmvc o spring-webflux.
        Tales aplicaciones tambi\u00e9n deben tener un registro para servir recursos
        est\u00e1ticos (JS, CSS, im\u00e1genes y otros) o tener un controlador anotado
        que devuelve org.springframework.core.io.Resource. Las aplicaciones Spring
        Boot que dependen de spring-boot-starter-web o spring-boot-starter-webflux
        est\u00e1n preparadas para servir recursos est\u00e1ticos de f\u00e1brica
        y son, por lo tanto, vulnerables."}], "affected": [{"source": "security_alert@emc.com",
