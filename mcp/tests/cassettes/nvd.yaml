        "support@hackerone.com", "published": "2021-05-26T19:15:08.773", "lastModified":
        "2026-08-31T18:08:14.137", "vulnStatus": "Analyzed", "cveTags": [], "descriptions":
        [{"lang": "en", "value": "In Versa Director, the command injection is an attack
        in which the goal is execution of arbitrary commands on the host operating
        system via a vulnerable application. Command injection attacks are possible
        when an application passes unsafe user supplied data (forms, cookies, HTTP
        headers etc.) to a system shell. In this attack, the attacker-supplied operating
        system commands are usually executed with the privileges of the vulnerable
        application. Command injection attacks are possible largely due to insufficient
        input validation."}, {"lang": "es", "value": "En Versa Director, la inyecci\u00f3n
        de comandos es un ataque en el que el objetivo es la ejecuci\u00f3n de comandos
        arbitrarios en el sistema operativo host mediante una aplicaci\u00f3n vulnerable.&#xa0;Los
        ataques de inyecci\u00f3n de comandos son posibles cuando una aplicaci\u00f3n
        pasa datos no seguros suministrados por el usuario (formularios, cookies,
        encabezados HTTP, etc.) a un shell del sistema.&#xa0;En este ataque, los comandos
        del sistema operativo proporcionados por el atacante son usualmente ejecutados
        con los privilegios de la aplicaci\u00f3n vulnerable.&#xa0;Los ataques de
        inyecci\u00f3n de Comandos son posibles en gran parte debido a una comprobaci\u00f3n
        de entrada insuficiente"}], "affected": [{"source": "support@hackerone.com",
