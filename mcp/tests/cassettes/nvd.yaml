        {"cve": {"id": "CVE-2019-1961", "sourceIdentifier": "psirt@cisco.com", "published":
        "2019-08-08T08:15:12.897", "lastModified": "2026-08-24T18:22:58.150", "vulnStatus":
        "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value": "A vulnerability
        in Cisco Enterprise NFV Infrastructure Software (NFVIS) could allow an authenticated,
        remote attacker to read arbitrary files on the underlying operating system
        (OS) of an affected device. The vulnerability is due to the improper input
        validation of tar packages uploaded through the Web Portal to the Image Repository.
        An attacker could exploit this vulnerability by uploading a crafted tar package
        and viewing the log entries that are generated. A successful exploit could
        allow the attacker to read arbitrary files on the underlying OS."}, {"lang":
        "es", "value": "Una vulnerabilidad en Enterprise NFV Infrastructure Software
        (NFVIS) de Cisco, podr\u00eda permitir a un atacante remoto autenticado leer
        archivos arbitrarios en el sistema operativo (SO) subyacente de un dispositivo
        afectado. La vulnerabilidad es debido a la comprobaci\u00f3n de entrada inapropiada
        de los  paquetes tar cargados por medio del Portal Web hacia el Repositorio
        de Im\u00e1genes. Un atacante podr\u00eda explotar esta vulnerabilidad cargando
        un paquete tar dise\u00f1ado y visualizar las entradas de registro que son
        generadas. Un explotaci\u00f3n con \u00e9xito podr\u00eda permitir al atacante
        leer archivos arbitrarios en el sistema operativo (SO) subyacente."}], "affected":
