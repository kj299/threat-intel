        Resource"]}]}}, {"cve": {"id": "CVE-2018-5745", "sourceIdentifier": "security-officer@isc.org",
        "published": "2019-10-09T16:15:14.000", "lastModified": "2026-09-01T19:44:42.623",
        "vulnStatus": "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "\"managed-keys\" is a feature which allows a BIND resolver to automatically
        maintain the keys used by trust anchors which operators configure for use
        in DNSSEC validation. Due to an error in the managed-keys feature it is possible
        for a BIND server which uses managed-keys to exit due to an assertion failure
        if, during key rollover, a trust anchor''s keys are replaced with keys which
        use an unsupported algorithm. Versions affected: BIND 9.9.0 -> 9.10.8-P1,
        9.11.0 -> 9.11.5-P1, 9.12.0 -> 9.12.3-P1, and versions 9.9.3-S1 -> 9.11.5-S3
        of BIND 9 Supported Preview Edition. Versions 9.13.0 -> 9.13.6 of the 9.13
        development branch are also affected. Versions prior to BIND 9.9.0 have not
        been evaluated for vulnerability to CVE-2018-5745."}, {"lang": "es", "value":
        "\"managed-keys\" es una caracter\u00edstica que permite a un solucionador
        BIND mantener autom\u00e1ticamente las claves usadas por los anclajes de confianza
        que los operadores configuran para su uso en la comprobaci\u00f3n  de DNSSEC.
        Debido a un error en la funcionalidad managed-keys, es posible que un servidor
        BIND que utiliza managed-keys salga debido a un error de aserci\u00f3n si,
        durante la renovaci\u00f3n de claves, las claves de un ancla de confianza
        son reemplazadas por claves que utilizan un algoritmo no compatible. Versiones
        afectadas: BIND 9.9.0 hasta 9.10.8-P1, 9.11.0 hasta 9.11.5-P1, 9.12.0 hasta
        9.12.3-P1 y versiones 9.9.3-S1 hasta 9.11.5- S3 de BIND 9 Supported Preview
        Edition. Las versiones 9.13.0 hasta 9.13.6 de la rama de desarrollo 9.13 tambi\u00e9n
        est\u00e1n afectadas. Las versiones anteriores a BIND 9.9.0 no han sido evaluadas
        para la vulnerabilidad de CVE-2018-5745."}], "affected": [{"source": "security-officer@isc.org",
