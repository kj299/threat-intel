        "published": "2017-10-04T01:29:02.120", "lastModified": "2026-08-25T16:28:27.310",
        "vulnStatus": "Analyzed", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "When running Apache Tomcat versions 9.0.0.M1 to 9.0.0, 8.5.0 to 8.5.22, 8.0.0.RC1
        to 8.0.46 and 7.0.0 to 7.0.81 with HTTP PUTs enabled (e.g. via setting the
        readonly initialisation parameter of the Default servlet to false) it was
        possible to upload a JSP file to the server via a specially crafted request.
        This JSP could then be requested and any code it contained would be executed
        by the server."}, {"lang": "es", "value": "Al ejecutar Apache Tomcat desde
        la versi\u00f3n 9.0.0.M1 hasta la 9.0.0, desde la 8.5.0 hasta la 8.5.22, desde
        la 8.0.0.RC1 hasta la 8.0.46 y desde la 7.0.0 hasta la 7.0.81 con los HTTP
        PUT habilitados (por ejemplo, configurando el par\u00e1metro de inicializaci\u00f3n
        de solo lectura del servlet Default a \"false\"), es posible subir un archivo
        JSP al servidor mediante una petici\u00f3n especialmente manipulada. Este
        JSP se puede despu\u00e9s solicitar y cualquier c\u00f3digo que contenga se
        ejecutar\u00eda por el servidor."}], "affected": [{"source": "security@apache.org",
