        {"cve": {"id": "CVE-2019-1973", "sourceIdentifier": "psirt@cisco.com", "published":
        "2019-08-08T08:15:13.147", "lastModified": "2026-08-24T18:22:58.150", "vulnStatus":
        "Modified", "cveTags": [], "descriptions": [{"lang": "en", "value": "A vulnerability
        in the web portal framework of Cisco Enterprise NFV Infrastructure Software
        (NFVIS) could allow an authenticated, remote attacker to conduct a cross-site
        scripting (XSS) attack against a user of the web-based interface. The vulnerability
        is due to improper input validation of log file content stored on the affected
        device. An attacker could exploit this vulnerability by modifying a log file
        with malicious code and getting a user to view the modified log file. A successful
        exploit could allow the attacker to execute arbitrary script code in the context
        of the affected interface or to access sensitive, browser-based information."},
        {"lang": "es", "value": "Una vulnerabilidad en framework portal web en Enterprise
        NFV Infrastructure Software (NFVIS) de Cisco, podr\u00eda permitir a un atacante
        remoto autenticado conducir un ataque de tipo cross-site scripting (XSS) contra
        un usuario de la interfaz basada en web. La vulnerabilidad es debido a una
        comprobaci\u00f3n inapropiada del contenido del archivo de registro almacenado
        en el dispositivo afectado. Un atacante podr\u00eda explotar esta vulnerabilidad
        modificando un archivo de registro con c\u00f3digo malicioso y logrando que
        un usuario visualice el archivo de registro modificado. Una explotaci\u00f3n
        con \u00e9xito podr\u00eda permitir al atacante ejecutar c\u00f3digo de script
        arbitrario en el contexto de la interfaz afectada o acceder a informaci\u00f3n
        confidencial basada en el navegador."}], "affected": [{"source": "psirt@cisco.com",
        "affectedData": [{"vendor": "Cisco", "product": "Cisco Enterprise NFV Infrastructure
