        {"cve": {"id": "CVE-2026-74638", "sourceIdentifier": "416baaa9-dc9f-4396-8d5f-8c081fb06d67",
        "published": "2026-08-22T16:16:37.007", "lastModified": "2026-08-25T06:18:43.493",
        "vulnStatus": "Received", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "In the Linux kernel, the following vulnerability has been resolved:\n\ndrm/v3d:
        Serialize the scheduler timeout handlers\n\nV3D exposes several independent
        hardware queues (BIN, RENDER, TFU and\nCSD) but has only a single, global
        reset. A timeout on any one queue\ntherefore has to stop, reset and restart
        the schedulers of every other\nqueue as well. That makes concurrent timeout
        handlers unsafe.\n\n`reset_lock` was never able to make them safe, as a driver-side
        lock can\nonly cover the driver''s &drm_sched_backend_ops.timedout_job callback.\nThe
        scheduler handles the timed out job and its pending list around that\ncallback,
        outside of the driver''s control, so a global reset triggered\nby one queue
        can still interfere with another queue that is in the\nmiddle of handling
        a timeout of its own.\n\nConsequently, if a reset happens in the CSD queue
        while a CL-intensive\napplication is running, the global reset stops and restarts
        the CL\nqueue''s scheduler while that queue is handling a timeout of its own.
        As\ndrm_sched_stop() and drm_sched_start() subtract and add the credits of\nevery
        job sitting on the pending list of the scheduler they are called\non, and
        as the CL queue''s handler concurrently takes its job off that\nsame list
        and puts it back, the stop and the start no longer see the\nsame set of jobs.
        The CL queue is left with more credits in flight than\nits limit:\n\n[  327.302739]
        ------------[ cut here ]------------\n[  327.302744] WARNING: CPU: 2 PID:
        43 at drivers/gpu/drm/scheduler/sched_main.c:102 drm_sched_run_job_work+0x238/0x4d0
        [gpu_sched]\n[  327.302884] CPU: 2 UID: 0 PID: 43 Comm: kworker/u16:1 Not
        tainted 6.18.39-v8-16k+ #3 PREEMPT\n[  327.302889] Hardware name: Raspberry
        Pi 5 Model B Rev 1.0 (DT)\n[  327.302893] Workqueue: v3d_bin drm_sched_run_job_work
        [gpu_sched]\n[  327.302984] Call trace:\n[  327.302987]  drm_sched_run_job_work+0x238/0x4d0
        [gpu_sched] (P)\n[  327.302997]  process_scheduled_works+0x180/0x3d0\n[  327.303010]  worker_thread+0x268/0x3e8\n[  327.303016]  kthread+0x140/0x250\n[  327.303022]  ret_from_fork+0x10/0x20\n[  327.303031]
        ---[ end trace 0000000000000000 ]---\n\nFrom that point on, the credit count
        of the CL queue is broken, causing\na complete GPU hang and UI freeze.\n\nThe
        DRM scheduler already provides a mechanism to serialize the timeout\nhandlers
        of different schedulers: an ordered workqueue passed as\ndrm_sched_init()''s
        @timeout_wq parameter. By default, each scheduler\nqueues its timeout work
        on the system workqueue, which runs the handlers\nconcurrently. Give all of
        the queues a shared ordered workqueue instead,\nas recommended by the DRM
        scheduler documentation for hardware that has\ndistinct queues but resets
        globally."}], "affected": [{"source": "416baaa9-dc9f-4396-8d5f-8c081fb06d67",
