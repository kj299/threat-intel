        "tags": ["Third Party Advisory"]}]}}, {"cve": {"id": "CVE-2023-22460", "sourceIdentifier":
        "security-advisories@github.com", "published": "2023-01-04T15:15:09.437",
        "lastModified": "2026-08-27T04:16:39.520", "vulnStatus": "Modified", "cveTags":
        [], "descriptions": [{"lang": "en", "value": "go-ipld-prime is an implementation
        of the InterPlanetary Linked Data (IPLD) spec interfaces, a batteries-included
        codec implementations of IPLD for CBOR and JSON, and tooling for basic operations
        on IPLD objects. Encoding data which contains a Bytes kind Node will pass
        a Bytes token to the JSON encoder which will panic as it doesn''t expect to
        receive Bytes tokens. Such an encode should be treated as an error, as plain
        JSON should not be able to encode Bytes. This only impacts uses of the `json`
        codec. `dag-json` is not impacted. Use of `json` as a decoder is not impacted.
        This issue is fixed in v0.19.0. As a workaround, one may prefer the `dag-json`
        codec, which has the ability to encode bytes."}, {"lang": "es", "value": "go-ipld-prime
        es una implementaci\u00f3n de las interfaces de especificaciones de datos
        vinculados interplanetarios (IPLD), que incluye implementaciones de c\u00f3dec
        de IPLD para CBOR y JSON y herramientas para operaciones b\u00e1sicas en objetos
        IPLD. La codificaci\u00f3n de datos que contiene un nodo de tipo Bytes pasar\u00e1
        un token de Bytes al codificador JSON, lo que entrar\u00e1 en p\u00e1nico
        porque no espera recibir tokens de Bytes. Dicha codificaci\u00f3n debe tratarse
        como un error, ya que JSON simple no deber\u00eda poder codificar bytes. Esto
        solo afecta los usos del c\u00f3dec \"json\". `dag-json` no se ve afectado.
        El uso de `json` como decodificador no se ve afectado. Este problema se solucion\u00f3
        en v0.19.0. Como workaround, se puede preferir el c\u00f3dec `dag-json`, que
        tiene la capacidad de codificar bytes."}], "affected": [{"source": "security-advisories@github.com",
