        "vulnStatus": "Analyzed", "cveTags": [], "descriptions": [{"lang": "en", "value":
        "A NULL pointer dereference flaw was found in the btrfs_rm_device function
        in fs/btrfs/volumes.c in the Linux Kernel, where triggering the bug requires
        \u2018CAP_SYS_ADMIN\u2019. This flaw allows a local attacker to crash the
        system or leak kernel internal information. The highest threat from this vulnerability
        is to system availability."}, {"lang": "es", "value": "Se ha encontrado un
        fallo de desreferencia de puntero NULL en la funci\u00f3n btrfs_rm_device
        en el archivo fs/btrfs/volumes.c en el Kernel de Linux, donde el desencadenamiento
        del bug requiere \"CAP_SYS_ADMIN\". Este fallo permite a un atacante local
        bloquear el sistema o filtrar informaci\u00f3n interna del kernel. La mayor
        amenaza de esta vulnerabilidad es la disponibilidad del sistema"}], "affected":
