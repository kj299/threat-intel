[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-intel-mcp"
version = "0.14.1"
description = "MCP server that delivers live threat intelligence feeds to Claude, normalised to the threat-intel skill schema"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1",
    "anyio>=4.4",
    "hvac>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-mock>=3.14",
    "vcrpy>=6.0",
    "jsonschema>=4.23",
    # Lint and coverage live here so `constraints-dev.txt` pins them too — CI
    # previously installed ruff unpinned, and a rule-set change in 0.16.0 broke
    # the build mid-PR (see the [tool.ruff.lint] note below).
    "ruff>=0.6",
    "coverage>=7.0",
]

[project.scripts]
threat-intel-mcp = "threat_intel_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_intel_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the rule set explicitly so `ruff check` is deterministic across ruff
# releases: a version that expands its default rules (0.16.0 added FLY and
# import-sort to the defaults, and broke lint across this repo mid-PR) would
# otherwise fail the build regardless of the diff. This is ruff's historical
# default selection, which the codebase already satisfies.
#
# CI now installs ruff at a pinned version from constraints-dev.txt, so this is
# the second of two independent guards rather than the only one. It still earns
# its place: it covers a bare `ruff check` run outside the constrained install —
# a contributor's editor integration or a pre-commit hook — and it keeps the
# lock file's job to "which version" rather than "which rules".
select = ["E4", "E7", "E9", "F"]
