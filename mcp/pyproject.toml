[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-intel-mcp"
version = "0.14.1"
description = "MCP server that delivers live threat intelligence feeds to Claude, normalised to the threat-intel skill schema"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1",
    "anyio>=4.4",
    "hvac>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-mock>=3.14",
    "vcrpy>=6.0",
    "jsonschema>=4.23",
    # Lint and coverage live here so `constraints-dev.txt` pins them too — CI
    # previously installed ruff unpinned, and a rule-set change in 0.16.0 broke
    # the build mid-PR (see the [tool.ruff.lint] note below).
    "ruff>=0.6",
    "coverage>=7.0",
]

[project.scripts]
threat-intel-mcp = "threat_intel_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_intel_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the rule set explicitly so `ruff check` is deterministic across ruff
# releases. CI installs ruff unpinned; without this, a new ruff version that
# expands its default rules (e.g. 0.16.0 adding FLY / import-sort to defaults)
# would break lint across the whole repo regardless of the diff. This is
# ruff's historical default selection, which the codebase already satisfies.
select = ["E4", "E7", "E9", "F"]
