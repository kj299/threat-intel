[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-intel-mcp"
version = "0.8.0"
description = "MCP server that delivers live threat intelligence feeds to Claude, normalised to the threat-intel skill schema"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1",
    "anyio>=4.4",
    "hvac>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-mock>=3.14",
    "vcrpy>=6.0",
    "jsonschema>=4.23",
]

[project.scripts]
threat-intel-mcp = "threat_intel_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_intel_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
