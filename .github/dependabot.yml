# Issue #80: dependencies are pinned in mcp/constraints-dev.txt so a surprise
# release can't break a build that touched none of it. Dependabot is the other
# half of that trade: updates still arrive, but as reviewable PRs that run the
# full 3.11/3.12/3.13 matrix first, instead of landing silently in CI.
version: 2

updates:
  - package-ecosystem: pip
    directory: /mcp # pyproject.toml + constraints-dev.txt live here
    schedule:
      interval: weekly
      day: monday
      time: "06:29" # off the :00 herd, before the weekly staleness check
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      # One PR for the test toolchain rather than five — these move together and
      # a pytest/plugin split across PRs tends to produce non-installable states.
      dev-tooling:
        patterns:
          - pytest*
          - ruff
          - coverage
          - vcrpy
      # pydantic and pydantic-settings move together often enough to be worth
      # one PR rather than two.
      #
      # Note grouping alone did NOT fix the pydantic-core problem (#99, #125):
      # a group only batches updates that are available at the same time, and
      # when pydantic-core releases ahead of pydantic there is nothing to batch
      # it with, so the group still produced a single unsatisfiable bump. The
      # actual fix is that pydantic_core is no longer pinned in
      # constraints-dev.txt at all -- see the comment there.
      pydantic:
        patterns:
          - pydantic
          - pydantic-core
          - pydantic_core
          - pydantic-settings

  - package-ecosystem: github-actions
    directory: / # .github/workflows/*
    schedule:
      interval: weekly
      day: monday
      time: "06:29"
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "ci"
