# Secret scan: fail any change that commits a credential.
#
# Why this exists: on 2026-09-12 the abuse.ch Auth-Key was committed in two
# recorded cassettes and sat in a public repository for five weeks. The
# repository's own guards (tests/test_vcr_harness.py) check the committed
# cassettes, but only cassettes, and only after the fact. This job runs
# gitleaks over every commit a PR adds, and over every push to main, with the
# repository-specific rules in .gitleaks.toml (the shape of that leak -- a hex
# value on the line below its header name -- is one no generic rule matches).
#
# What it does NOT replace: GitHub's own secret scanning + push protection,
# which cover every branch, all history and issue/PR text continuously and
# would have refused that push at the remote. Those are repository settings
# (#164) and need a human to enable them.
#
# Scope by trigger:
#   pull_request  -- the PR's commits only (base..head)
#   push to main  -- the pushed range
#   dispatch      -- full history (fetch-depth 0). The historical abuse.ch key
#                    is still in commits 8930e36..36e44b4 and WILL be reported
#                    by a full-history run until history is rewritten; that is
#                    the correct answer, not a false positive.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified against the release)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Keep the release filename: sha256sum -c looks the file up by the name in the checksum line.
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tgz" "${base}/${tgz}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tgz}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          ./gitleaks version

      - name: Choose the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) echo "opts=--log-opts=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT" ;;
            push)
              # A brand-new branch has an all-zero "before"; scan the one commit.
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "opts=--log-opts=-1 ${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
              else
                echo "opts=--log-opts=${PUSH_BEFORE}..${PUSH_AFTER}" >> "$GITHUB_OUTPUT"
              fi ;;
            *) echo "opts=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Scan
        env:
          OPTS: ${{ steps.range.outputs.opts }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # OPTS is one flag, possibly with an embedded space
          ./gitleaks git --config .gitleaks.toml --redact=100 --exit-code 1 --verbose $OPTS .
