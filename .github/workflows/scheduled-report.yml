name: scheduled-report

# Issue #77: the weekly threat-intel report cadence died on 2026-07-06 and went
# unnoticed for 18 days, because the thing that produced reports/ lived entirely
# in an operator's Claude Code configuration and nothing in this repository
# described or ran it. report-staleness.yml detects that death; this workflow is
# the mechanism itself, committed so it is reproducible and reviewable.
#
# ─── STATUS: UNVERIFIED UNTIL FIRST MANUAL RUN ───────────────────────────────
# Never executed — no credential is configured here, and the action's docs carry
# no cron example. Run it once via workflow_dispatch and check the resulting PR
# before trusting the schedule.
#
# Input names are verified against claude-code-action's action.yml at the v1 tag:
# prompt, anthropic_api_key, claude_code_oauth_token and claude_args all exist.
# The --allowedTools value is verified too — a permission rule naming only the
# server ("mcp__threat-intel") matches every tool that server provides, so the
# MCP half needs no per-tool enumeration. What is still unproven is the run
# itself: whether --max-turns 40 is enough for a nine-tier research pass that
# ends in a commit and a PR, and whether the skill behaves as expected with feeds
# actually connected.
#
# ─── CREDENTIAL: EITHER ONE WORKS ────────────────────────────────────────────
# Set one repository secret:
#
#   CLAUDEOUATH              — from `claude setup-token`, billed against a Pro,
#   (or CLAUDE_CODE_OAUTH_TOKEN) Max, Team or Enterprise subscription. Either
#                              name is read; this repo uses the former.
#   ANTHROPIC_API_KEY        — a Claude Console API key, billed per token.
#                              Requires credits: a Console key is separate from
#                              a Claude subscription and is NOT funded by it.
#
# This workflow runs weekly forever, so the choice is a standing billing
# decision, not a one-off.
#
# **The OAuth token wins when both are set**, and the generate step passes only
# the chosen credential — the other is blanked. That matters: the action
# forwards both to Claude Code, whose own precedence ranks ANTHROPIC_API_KEY
# *above* the OAuth token, so a leftover API key would otherwise silently
# hijack a run the subscription token was configured for. It did exactly that
# in run 33322230662, which failed after three minutes of retries against a
# credit-less key while a valid OAuth token sat unused. Nobody should have to
# delete a secret to make the configured one take effect.
#
# ─── SAFE WHEN UNCONFIGURED ──────────────────────────────────────────────────
# With neither secret set every step is skipped and the run succeeds with a
# notice. It will not fail weekly in a repo that hasn't opted in.
#
# ─── DO NOT ADD FEED CREDENTIALS TO THIS WORKFLOW ────────────────────────────
# Only the two model credentials above belong here. No QFEEDS_API_KEY, no
# VIRUSTOTAL_API_KEY, none of the other ten. CI enforces this — see "Agent
# credential isolation" in validate.yml.
#
# This is not an ordinary CI job. It runs an LLM agent whose entire purpose is
# to ingest untrusted content — threat feeds, vendor blogs, leak-site
# aggregators, arbitrary web pages — while holding Write access and the ability
# to open a PR. Anything in this step's environment is reachable by that agent
# and can leave in a file it commits. GitHub's log masking does not cover a
# committed file, and would not catch a transformed value in a log either.
#
# Narrowing --allowedTools does not fix it. Claude Code runs a built-in set of
# read-only Bash commands without consulting the allowlist, and that set
# includes `echo` and `cat`; the docs state it "is not configurable". So
# `echo $VIRUSTOTAL_API_KEY` is available under any Bash allow rule, and
# enumerating deny rules for every way a shell can read its own environment is
# whack-a-mole that would only look like protection.
#
# The keyless feeds this workflow actually needs (ThreatFox, CISA KEV, NVD) take
# no credential, so there is nothing to isolate today. If paid feeds are wanted
# later, fetch them in a separate step and hand the agent a data file — the
# shape record-cassettes.yml already uses, where the credentials sit in a step
# that runs a fixed script rather than an agent. See docs/report-runbook.md.
#
# ─── NOTE FOR #76 ────────────────────────────────────────────────────────────
# GitHub-hosted runners have open outbound internet, so the keyless feeds
# (ThreatFox, CISA KEV, NVD) are reachable here even though they are blocked by
# the proxy in the default cloud dev environment. A successful run of this
# workflow would also satisfy #76's "first MCP-connected report".

on:
  schedule:
    # Mondays 05:23 UTC — deliberately ahead of report-staleness.yml (06:17 Mon)
    # so a successful generation clears the alarm in the same hour. Off :00.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      persona:
        description: "Skill persona"
        default: enterprise_soc
        type: string
      time_range:
        description: "Lookback window (e.g. 7d, 14d)"
        default: 7d
        type: string

permissions:
  contents: write # commit the report to a branch
  pull-requests: write # open the PR carrying it
  # Required by claude-code-action, and not optional: it mints its GitHub token
  # by exchanging an Actions OIDC token (setupGitHubToken -> getOidcToken).
  # Without this the action retries three times and fails in ~15s with
  # "Could not fetch an OIDC token", before Claude is ever invoked. Found on the
  # first real dispatch (run 33320791061) — the steps before it all passed.
  id-token: write

jobs:
  generate:
    name: Generate threat-intel report
    runs-on: ubuntu-latest
    steps:
      - name: Check whether report generation is configured
        id: guard
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Either name works. CLAUDEOUATH is the name configured in this repo;
          # CLAUDE_CODE_OAUTH_TOKEN is accepted too so a rename needs no code
          # change. An unset secret is an empty string, so `||` picks the one
          # that exists.
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDEOUATH }}
        run: |
          # Subscription billing wins when both are present. This ordering is
          # deliberate and is the opposite of Claude Code's own credential
          # precedence, which ranks ANTHROPIC_API_KEY above the OAuth token —
          # which is why the generate step below passes only the chosen one
          # rather than both. A leftover API key must not be able to hijack a
          # run that a subscription token was configured for (it did exactly
          # that in run 33322230662, failing after 3 minutes of retries).
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Using OAuth token (subscription billing)."
          elif [ -n "$API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Using ANTHROPIC_API_KEY (per-token billing)."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No model credential is set \
            — skipping report generation. Set CLAUDEOUATH / CLAUDE_CODE_OAUTH_TOKEN \
            or ANTHROPIC_API_KEY to enable the weekly cadence \
            (see docs/report-runbook.md)."
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.configured == 'true'
        with:
          python-version: "3.12"

      - name: Install threat-intel-mcp (pinned)
        if: steps.guard.outputs.configured == 'true'
        run: pip install -e "./mcp[dev]" -c mcp/constraints-dev.txt

      - name: Verify the keyless feeds are reachable from this runner
        if: steps.guard.outputs.configured == 'true'
        # Fail fast and loudly here rather than producing a no-live-data report
        # that silently looks like every previous one.
        run: |
          python - <<'PY'
          import asyncio, sys
          from threat_intel_mcp.adapters.threatfox import ThreatFoxAdapter
          from threat_intel_mcp.adapters.cisa_kev import CISAKEVAdapter

          async def main():
              failures = []
              for adapter in (ThreatFoxAdapter(), CISAKEVAdapter()):
                  try:
                      result = await adapter.fetch(time_range="7d")
                      print(f"{adapter.name}: {result.record_count} records")
                      if result.record_count == 0:
                          failures.append(f"{adapter.name} returned zero records")
                  except Exception as exc:
                      failures.append(f"{adapter.name}: {type(exc).__name__}: {exc}")
              if failures:
                  print("::error::live feed check failed: " + "; ".join(failures))
                  sys.exit(1)

          asyncio.run(main())
          PY

      - name: Generate the report
        if: steps.guard.outputs.configured == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Pass ONLY the credential the guard selected — never both. The action
          # forwards each to Claude Code, whose own precedence ranks
          # ANTHROPIC_API_KEY above the OAuth token, so passing both would let a
          # leftover API key silently override the subscription token this repo
          # is configured for. Blanking the unused one is what makes the guard's
          # choice actually binding.
          anthropic_api_key: ${{ (secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDEOUATH) == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDEOUATH }}
          claude_args: >-
            --mcp-config '{"mcpServers":{"threat-intel":{"command":"threat-intel-mcp"}}}'
            --allowedTools "Read,Write,Edit,Bash,mcp__threat-intel"
            --max-turns 40
          prompt: |
            Generate this week's threat intelligence report using the
            cyber-threat-intel skill in skills/cyber-threat-intel/SKILL.md.

            Persona: ${{ inputs.persona || 'enterprise_soc' }}
            Time range: ${{ inputs.time_range || '7d' }}

            The threat-intel-mcp server is connected. Follow Workflow step 2a:
            call fetch_all_iocs and fetch_all_cves, and fold the live results in.
            Only ThreatFox, CISA KEV and NVD are configured (no API keys are
            set) — the other feeds will correctly report as degraded.

            Honesty rules are the point of this report, not paperwork:
              - The Coverage Ledger records exactly what the tools reported. A
                source the tools call partial or unverified is recorded that way
                and never upgraded.
              - The coverage badge must match the ledger count. MINIMAL on a
                quiet week is the correct answer; do not inflate it.
              - Every IOC and CVE cites the feed it came from. Never invent an
                indicator, hash, CVE ID, or attribution to fill space (R3).
              - State plainly in the methodology notice that live threat-intel-mcp
                feeds WERE connected for this run, and which ones.

            Save it as reports/<YYYY-MM-DD>-threat-intel.md using today's date,
            on a new branch, and open a pull request titled
            "Add scheduled threat-intel report: <YYYY-MM-DD> (<persona>, <range>)".
            Do not modify any file outside reports/.
