name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKILL_DIR: skills/cyber-threat-intel
  SKILL_FILE: skills/cyber-threat-intel/SKILL.md
  SPEC_FILE: skills/cyber-threat-intel/spec.yaml
  SCHEMA_FILE: skills/cyber-threat-intel/schemas/output.schema.json
  EXAMPLES_FILE: skills/cyber-threat-intel/examples/outputs.json
  PROMPT_FILE: skills/cyber-threat-intel/references/original-prompt.md

jobs:
  validate:
    name: JSON, YAML, and schema conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install jsonschema pyyaml rfc3339-validator

      - name: Validate skill directory layout (Anthropic Agent Skills convention)
        run: |
          python <<'PY'
          import os, pathlib, sys, re
          skill_dir = pathlib.Path(os.environ['SKILL_DIR'])
          skill_file = pathlib.Path(os.environ['SKILL_FILE'])
          errors = []
          if not skill_dir.is_dir():
              errors.append(f"missing skill directory: {skill_dir}")
          if not skill_file.is_file():
              errors.append(f"missing SKILL.md entrypoint: {skill_file}")
          else:
              text = skill_file.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  errors.append("SKILL.md does not begin with YAML frontmatter '---' fence")
              else:
                  end = text.find('\n---\n', 4)
                  if end < 0:
                      errors.append("SKILL.md frontmatter is not closed with '---'")
                  else:
                      import yaml
                      fm = yaml.safe_load(text[4:end])
                      if not isinstance(fm, dict):
                          errors.append("SKILL.md frontmatter is not a YAML mapping")
                      else:
                          name = fm.get('name')
                          desc = fm.get('description')
                          if not name:
                              errors.append("SKILL.md frontmatter missing required 'name'")
                          elif not re.fullmatch(r'[a-z0-9-]{1,64}', name):
                              errors.append(
                                  f"SKILL.md frontmatter 'name'={name!r} violates spec "
                                  "(lowercase letters, digits, hyphens only, max 64 chars)"
                              )
                          elif name != skill_dir.name:
                              errors.append(
                                  f"SKILL.md 'name'={name!r} does not match directory name "
                                  f"{skill_dir.name!r}"
                              )
                          if not desc:
                              errors.append("SKILL.md frontmatter missing recommended 'description'")
                          elif len(desc) > 1024:
                              errors.append(
                                  f"SKILL.md 'description' is {len(desc)} chars; spec caps at 1024"
                              )
              body_lines = text.splitlines()
              if len(body_lines) > 500:
                  errors.append(
                      f"SKILL.md is {len(body_lines)} lines; spec recommends keeping it under 500 "
                      "and offloading detail to references/"
                  )
          if errors:
              print("FAIL: skill layout violations:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print(f"OK: {skill_file} conforms to Agent Skills convention")
          PY

      - name: Validate JSON syntax
        run: |
          python -c "import json, os; json.load(open(os.environ['SCHEMA_FILE'], encoding='utf-8'))"
          python -c "import json, os; json.load(open(os.environ['EXAMPLES_FILE'], encoding='utf-8'))"

      - name: Validate YAML syntax
        run: |
          python -c "import yaml, os; yaml.safe_load(open(os.environ['SPEC_FILE'], encoding='utf-8'))"

      - name: Validate examples conform to schema
        run: |
          python <<'PY'
          import json, os, sys, jsonschema
          with open(os.environ['SCHEMA_FILE'], encoding='utf-8') as f:
              schema = json.load(f)
          with open(os.environ['EXAMPLES_FILE'], encoding='utf-8') as f:
              data = json.load(f)
          examples = data.get('examples', data)
          items = list(examples.items()) if isinstance(examples, dict) else list(enumerate(examples))
          fails = []
          for k, v in items:
              try:
                  jsonschema.validate(instance=v, schema=schema)
              except jsonschema.ValidationError as e:
                  fails.append(f"  [{k}] path={list(e.absolute_path)} :: {e.message[:240]}")
          if fails:
              print("FAIL: examples do not validate against schema:")
              print(*fails, sep="\n")
              sys.exit(1)
          print(f"OK: all {len(items)} examples validate against schema")
          PY

      - name: Cross-file version consistency
        run: |
          python <<'PY'
          import json, os, re, sys, pathlib, yaml
          with open(os.environ['SPEC_FILE'], encoding='utf-8') as f:
              truth = yaml.safe_load(f)['skill']['version']
          mismatches = []
          with open(os.environ['SCHEMA_FILE'], encoding='utf-8') as f:
              v = json.load(f).get('version')
          if v != truth:
              mismatches.append(f"{os.environ['SCHEMA_FILE']} :: version={v!r}")
          with open(os.environ['EXAMPLES_FILE'], encoding='utf-8') as f:
              examples = json.load(f)['examples']
          for i, ex in enumerate(examples):
              sv = ex.get('output', {}).get('metadata', {}).get('skill_version')
              if sv != truth:
                  mismatches.append(
                      f"{os.environ['EXAMPLES_FILE']}[{i}] persona={ex.get('persona')!r} :: skill_version={sv!r}"
                  )
          text = pathlib.Path('changelog.md').read_text(encoding='utf-8')
          m = re.search(r'^##\s*\[(\d+\.\d+\.\d+)\]', text, re.MULTILINE)
          if m is None:
              mismatches.append("changelog.md :: no '## [X.Y.Z]' section header found")
          elif m.group(1) != truth:
              mismatches.append(f"changelog.md :: top entry is {m.group(1)!r}")
          if mismatches:
              print(f"FAIL: version mismatch -- source of truth (spec.yaml skill.version) = {truth!r}")
              for line in mismatches:
                  print(f"  {line}")
              sys.exit(1)
          print(f"OK: version {truth!r} consistent across spec, schema, examples, and changelog")
          PY

      - name: Persona parity (spec yaml vs examples)
        run: |
          python <<'PY'
          import json, os, sys, yaml
          with open(os.environ['SPEC_FILE'], encoding='utf-8') as f:
              skill = yaml.safe_load(f)
          profiles = skill['persona_profiles']
          yaml_personas = {k for k in profiles if k != 'description'}
          with open(os.environ['EXAMPLES_FILE'], encoding='utf-8') as f:
              examples = json.load(f)['examples']
          example_personas = [ex.get('persona') for ex in examples]
          example_set = set(example_personas)
          errors = []
          missing = yaml_personas - example_set
          if missing:
              errors.append(f"defined in spec.yaml but missing from examples: {sorted(missing)}")
          extra = example_set - yaml_personas
          if extra:
              errors.append(f"present in examples but not defined in spec.yaml: {sorted(extra)}")
          dups = sorted({p for p in example_personas if example_personas.count(p) > 1})
          if dups:
              errors.append(f"persona has multiple examples: {dups}")
          if errors:
              print("FAIL: persona parity:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print(f"OK: {len(yaml_personas)} personas in spec.yaml each have exactly one example")
          PY

      - name: Coverage ledger consistency
        run: |
          python <<'PY'
          import json, math, os, re, sys, yaml
          with open(os.environ['SPEC_FILE'], encoding='utf-8') as f:
              skill = yaml.safe_load(f)
          tier_mins_yaml = skill['source_coverage_protocol']['tier_minimums']
          must_total = skill['source_coverage_protocol']['must_minimum_total']
          partial_floor = math.ceil(must_total / 2)

          def tier_num(key):
              m = re.match(r'tier_(\d+)_', key)
              return int(m.group(1)) if m else None
          yaml_tier_min = {tier_num(k): v for k, v in tier_mins_yaml.items() if tier_num(k)}

          def norm(v):
              if isinstance(v, str):
                  return v.lower().replace('-', '_')
              return v

          def expected_badge(total):
              if total >= must_total: return 'FULL'
              if total >= partial_floor: return 'PARTIAL'
              return 'MINIMAL'

          with open(os.environ['EXAMPLES_FILE'], encoding='utf-8') as f:
              examples = json.load(f)['examples']

          all_errors = []
          checked = 0
          for ex in examples:
              persona = ex.get('persona', '?')
              meta = ex.get('output', {}).get('metadata', {})
              ledger = ex.get('output', {}).get('coverage_ledger', [])
              src_ref = meta.get('sources_referenced')
              badge = meta.get('coverage_badge')
              if not ledger and src_ref is None and badge is None:
                  continue
              errs = []
              if not ledger: errs.append('coverage_ledger missing')
              if src_ref is None: errs.append('metadata.sources_referenced missing')
              if badge is None: errs.append('metadata.coverage_badge missing')
              if errs:
                  all_errors.append((persona, errs))
                  continue
              total = sum(len(e.get('consulted', [])) for e in ledger)
              if total != src_ref:
                  errs.append(f"sources_referenced={src_ref} but sum(consulted)={total}")
              eb = expected_badge(total)
              if eb != badge:
                  errs.append(f"coverage_badge={badge!r} but expected {eb!r} for total={total}")
              ledger_tiers = {e.get('tier') for e in ledger}
              missing = sorted(set(yaml_tier_min) - ledger_tiers)
              if missing:
                  errs.append(f"tiers in YAML but missing from ledger: {missing}")
              for e in ledger:
                  t = e.get('tier')
                  rm = e.get('required_min')
                  expected_rm = yaml_tier_min.get(t)
                  if expected_rm is None:
                      errs.append(f"tier {t}: not declared in YAML tier_minimums")
                      continue
                  if norm(rm) != norm(expected_rm):
                      errs.append(f"tier {t}: required_min={rm!r} but YAML says {expected_rm!r}")
                  c = len(e.get('consulted', []))
                  met_actual = e.get('met')
                  if isinstance(rm, int):
                      met_expected = c >= rm
                      if met_expected != met_actual:
                          errs.append(f"tier {t}: met={met_actual} but consulted={c} required_min={rm}")
              if errs:
                  all_errors.append((persona, errs))
              else:
                  checked += 1

          if all_errors:
              print("FAIL: coverage ledger consistency:")
              for persona, errs in all_errors:
                  print(f"  [{persona}]")
                  for e in errs:
                      print(f"    - {e}")
              sys.exit(1)
          print(f"OK: {checked} example(s) with coverage data are internally consistent")
          PY

      - name: Source-matrix tier parity (prompt vs spec vs schema)
        run: |
          python <<'PY'
          import json, os, pathlib, re, sys, yaml

          STOPWORDS = {
              'and', 'or', 'of', 'the', 'a', 'an', 'in', 'on', 'for', 'to', 'with',
              'mostly', 'paywalled', 'mark', 'unverified', 'if', 'inaccessible',
          }

          def slugify(s):
              s = s.lower()
              s = re.sub(r'\([^)]*\)', '', s)
              s = s.replace('&', ' and ')
              tokens = re.split(r'[^a-z0-9]+', s)
              return {t for t in tokens if t and t not in STOPWORDS and len(t) > 1}

          def tier_num_from_key(key):
              m = re.match(r'tier_?(\d+)', key)
              return int(m.group(1)) if m else None

          # 1. Prompt headings: ### Tier N <sep> <name>
          prompt_text = pathlib.Path(os.environ['PROMPT_FILE']).read_text(encoding='utf-8')
          heading_re = re.compile(r'^#{1,6}\s*Tier\s*(\d+)\s*[:\-–—]\s*(.+?)\s*$', re.MULTILINE)
          prompt_tiers = {}
          for m in heading_re.finditer(prompt_text):
              n = int(m.group(1))
              if n in prompt_tiers:
                  print(f"FAIL: duplicate Tier {n} heading in {os.environ['PROMPT_FILE']}")
                  sys.exit(1)
              prompt_tiers[n] = m.group(2)

          # 2. YAML source_coverage_protocol.tier_minimums and source_tiers
          skill = yaml.safe_load(open(os.environ['SPEC_FILE'], encoding='utf-8'))
          tier_min_keys = list(skill['source_coverage_protocol']['tier_minimums'].keys())
          source_tier_keys = list(skill['source_tiers'].keys())
          yaml_tier_min = {}
          for k in tier_min_keys:
              n = tier_num_from_key(k)
              if n is None:
                  print(f"FAIL: tier_minimums key {k!r} does not start with tier_<N>")
                  sys.exit(1)
              yaml_tier_min[n] = k
          yaml_source_tiers = {}
          for k in source_tier_keys:
              n = tier_num_from_key(k)
              if n is None:
                  print(f"FAIL: source_tiers key {k!r} does not start with tier_<N>")
                  sys.exit(1)
              entry = skill['source_tiers'][k]
              name = entry.get('name', '') if isinstance(entry, dict) else ''
              yaml_source_tiers[n] = name

          # 3. Schema range from coverage_ledger.items.properties.tier
          schema = json.load(open(os.environ['SCHEMA_FILE'], encoding='utf-8'))
          tier_prop = schema['properties']['skill_output']['properties']['coverage_ledger']['items']['properties']['tier']
          schema_min = tier_prop.get('minimum')
          schema_max = tier_prop.get('maximum')
          if schema_min is None or schema_max is None:
              print("FAIL: schema coverage_ledger.items.properties.tier is missing minimum/maximum")
              sys.exit(1)
          schema_tiers = set(range(schema_min, schema_max + 1))

          # Compare tier sets
          prompt_set = set(prompt_tiers)
          tmin_set = set(yaml_tier_min)
          stier_set = set(yaml_source_tiers)
          all_sources = {
              f'{os.environ["PROMPT_FILE"]} headings': prompt_set,
              'spec.yaml tier_minimums': tmin_set,
              'spec.yaml source_tiers': stier_set,
              'schema coverage_ledger.tier range': schema_tiers,
          }
          reference = prompt_set
          mismatches = []
          for label, s in all_sources.items():
              if s != reference:
                  mismatches.append(f"  {label}: {sorted(s)}")
          if mismatches:
              print("FAIL: tier numbering disagreement.")
              print(f"  prompt headings: {sorted(reference)}")
              for line in mismatches:
                  print(line)
              sys.exit(1)

          # Name-overlap check per tier
          name_errors = []
          for n in sorted(reference):
              prompt_slug = slugify(prompt_tiers[n])
              tmin_slug = slugify(yaml_tier_min[n].split('_', 2)[-1] if '_' in yaml_tier_min[n] else yaml_tier_min[n])
              stier_slug = slugify(yaml_source_tiers[n])
              checks = [
                  ('prompt heading vs spec.yaml source_tiers.name', prompt_slug, stier_slug),
                  ('spec.yaml tier_minimums slug vs source_tiers.name', tmin_slug, stier_slug),
              ]
              for label, a, b in checks:
                  if not (a & b):
                      name_errors.append(
                          f"  Tier {n}: {label} share no token. "
                          f"prompt={prompt_tiers[n]!r} tmin={yaml_tier_min[n]!r} "
                          f"source_tiers.name={yaml_source_tiers[n]!r}"
                      )
          if name_errors:
              print("FAIL: tier name drift (no shared significant token):")
              for e in name_errors:
                  print(e)
              sys.exit(1)

          print(f"OK: {len(reference)} tiers numbered consistently across prompt, spec, and schema, with overlapping names")
          PY

      - name: Negative schema fixtures (tests/invalid)
        run: |
          python <<'PY'
          import json, os, pathlib, sys, jsonschema
          schema = json.load(open(os.environ['SCHEMA_FILE'], encoding='utf-8'))
          def resolve_subschema(def_name):
              if def_name in schema.get('definitions', {}):
                  return schema['definitions'][def_name]
              if def_name == 'skill_output_metadata':
                  return schema['properties']['skill_output']['properties']['metadata']
              return None
          resolver = jsonschema.RefResolver.from_schema(schema)
          fmt = jsonschema.FormatChecker()
          if 'date-time' not in fmt.checkers:
              print("FAIL: rfc3339-validator missing; date-time format will not be checked")
              sys.exit(1)
          root = pathlib.Path('tests/invalid')
          if not root.exists():
              print(f"OK: no {root} directory; nothing to check")
              sys.exit(0)
          errors, wrong_pass, checked = [], [], 0
          for fixture in sorted(root.rglob('*.json')):
              rel = fixture.relative_to(root)
              if len(rel.parts) < 2:
                  errors.append(f"{rel}: must be under a subdirectory naming the subschema")
                  continue
              def_name = rel.parts[0]
              subschema = resolve_subschema(def_name)
              if subschema is None:
                  errors.append(f"{rel}: unknown subschema {def_name!r}")
                  continue
              try:
                  instance = json.loads(fixture.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append(f"{rel}: parse error: {e}")
                  continue
              try:
                  jsonschema.validate(
                      instance=instance, schema=subschema,
                      resolver=resolver, format_checker=fmt,
                  )
                  wrong_pass.append(f"{rel}: should have been rejected, but passed")
              except jsonschema.ValidationError:
                  checked += 1
          if errors:
              print("FAIL: malformed fixtures:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          if wrong_pass:
              print("FAIL: fixtures wrongly accepted (schema regressed):")
              for w in wrong_pass:
                  print(f"  {w}")
              sys.exit(1)
          print(f"OK: all {checked} invalid fixtures correctly rejected")
          PY
