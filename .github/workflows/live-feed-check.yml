name: live-feed-check

# Issue #78: every test in mcp/tests/ runs against mocks — deliberately, and PR
# CI should stay that way. But it means a live feed could be dead, moved, or
# schema-drifted for weeks with no signal. The URL layouts and response shapes
# were verified once at build time; nothing re-verified them.
#
# ThreatFox proved the gap is real: the adapter returned 0 IOCs from a live
# 1 MB response and nothing surfaced it until an operator ran the feeds by hand
# on a Windows machine, 18 days into the silence (#76, #100).
#
# ─── RELATIONSHIP TO THE OTHER TWO LAYERS ────────────────────────────────────
#   #105 cassettes  — prevention: parsing is tested against captured bytes,
#                     but a cassette is a snapshot and keeps passing after the
#                     live feed moves on.
#   #106 guards     — at fetch time: an unreadable body degrades instead of
#                     publishing a zero, but something must be running to see it.
#   this workflow   — detection: drift becomes an alarm within days.
#
# ─── SCOPE ───────────────────────────────────────────────────────────────────
# Every feed this repository can reach: the keyless three (ThreatFox, CISA KEV,
# NVD unauthenticated) plus every credentialed adapter whose key is configured.
#
# This previously covered the keyless feeds only, on the reasoning that "a
# scheduled job holding nine live API keys would be a standing liability for a
# check whose value is mostly in the free feeds". That was written when the
# repository held no feed credentials at all. Six now exist, and the value moved
# with them -- the keyless feeds have never broken, while the credentialed ones
# produced two faults in one day that nothing offline could see: five secrets
# named so the workflow never read them (#197), and a VirusTotal key that
# resolves and is then rejected for an insufficient plan. Neither is visible to
# any mock, cassette, or parity check; only a live call finds them.
#
# The liability is also smaller than that note assumed. This runs a fixed pytest
# process, not an agent, so the credentials sit in exactly the shape the
# `prefetch` job in scheduled-report.yml already uses with the same set of keys.
#
# **A feed with no credential SKIPS; a feed WITH one that fails FAILS.** Without
# that split the check is noise -- nine "no credential" lines every week,
# indistinguishable from a real outage -- and it would be muted within a month.
# With it, a red run means one thing: a key this repository holds stopped
# working against its API. Forks and unconfigured repos see every keyed test
# skip and the keyless three still run, so nothing here needs a secret to pass.

on:
  schedule:
    # Thursdays 07:41 UTC — mid-week and off the :00 herd, so a break is caught
    # days before the Monday report run rather than by it.
    - cron: "41 7 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Live keyless feed check
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install threat-intel-mcp (pinned)
        working-directory: mcp
        run: pip install -e ".[dev]" -c constraints-dev.txt

      - name: Run live feed checks
        id: live
        working-directory: mcp
        continue-on-error: true # a failure must open an issue, not just go red
        env:
          # Every credentialed adapter's key. Unset secrets interpolate to an
          # empty string rather than being absent, which is why the tests test
          # for a non-empty value and skip rather than fail on one.
          QFEEDS_API_KEY: ${{ secrets.QFEEDS_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY || secrets.ABUSEIPDB }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY || secrets.VIRUSTOTAL_API }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY || secrets.ALIENVAULT_OTX_API }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY || secrets.SHODAN }}
          GREYNOISE_API_KEY: ${{ secrets.GREYNOISE_API_KEY || secrets.GREYNOISE_API }}
          ANYRUN_API_KEY: ${{ secrets.ANYRUN_API_KEY }}
          INTEL471_EMAIL: ${{ secrets.INTEL471_EMAIL }}
          INTEL471_API_KEY: ${{ secrets.INTEL471_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
        run: |
          set -o pipefail
          python -m pytest -m live -v --tb=short 2>&1 | tee live-check.log

      - name: Summarise
        id: summary
        working-directory: mcp
        run: |
          {
            echo "## Live feed check"
            echo
            echo '```'
            grep -E '(PASSED|FAILED|ERROR|passed|failed)' live-check.log | tail -25 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Keep the failure detail small enough for an issue body.
          grep -E '^(FAILED|ERROR)' live-check.log | head -20 > failures.txt || true
          echo "count=$(wc -l < failures.txt)" >> "$GITHUB_OUTPUT"

      - name: Open or bump the alarm issue
        if: steps.live.outcome == 'failure'
        working-directory: mcp
        run: |
          set -euo pipefail
          detail=$(cat failures.txt)
          title="Live feed check failing"
          body="The scheduled live check against the keyless feeds failed on $(date -u +%F).

          \`\`\`
          ${detail}
          \`\`\`

          [Full log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          This checks every feed against its real endpoint — the keyless three
          (ThreatFox, CISA KEV, NVD) plus every credentialed adapter whose key is
          configured. A feed with no credential skips, so a failure here means one
          of two things: a keyless feed is down, moved or schema-drifted, or a key
          this repository holds has stopped working against its API. PR CI is
          mock-only and will stay green regardless, which is why this alarm exists
          (#78).

          Close it when the feeds pass again.

          _Opened automatically by the live-feed-check workflow._"

          # Title-based dedupe: bump the existing alarm rather than stacking new ones.
          existing=$(gh issue list --state open --search "Live feed check failing in:title" --json number --jq '.[0].number' || true)
          if [ -n "${existing:-}" ] && [ "${existing}" != "null" ]; then
            gh issue comment "$existing" --body "Still failing as of $(date -u +%F). [Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the alarm if the feeds recovered
        if: steps.live.outcome == 'success'
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "Live feed check failing in:title" --json number --jq '.[0].number' || true)
          if [ -n "${existing:-}" ] && [ "${existing}" != "null" ]; then
            gh issue close "$existing" --comment "Live feeds passing again as of $(date -u +%F); closing automatically."
          fi

      - name: Fail the run if the live checks failed
        if: steps.live.outcome == 'failure'
        # The issue is the durable signal, but the run itself should still be
        # red — a green history of failing checks teaches people to ignore it.
        run: exit 1
