name: threatfox-prefetch

# Proposed in a draft PR. Merging this schedule is an explicit activation step.
# No model, email, submissions, repository writes or credentials in the consumer.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * *'
      timezone: America/New_York

permissions:
  contents: read

concurrency:
  group: threatfox-prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    name: Fetch ThreatFox (holds credential; no agent)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: pip install -e './mcp[dev]' -c mcp/constraints-dev.txt
      - name: Fetch and scan ThreatFox data
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python mcp/scripts/prefetch_threatfox.py --out "$RUNNER_TEMP/feed-data.json"
      - name: Upload bounded data only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: threatfox-feed-data
          path: ${{ runner.temp }}/feed-data.json
          if-no-files-found: error
          retention-days: 1
